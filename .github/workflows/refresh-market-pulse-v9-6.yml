name: Refresh Market Pulse v9.6

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1,13 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_market_pulse.py"
      - "scripts/test_market_pulse_narrative.py"
      - "tests/test_market_pulse_diagnostics.py"
      - "scripts/validate_market_pulse.py"
      - "data/market_universe.json"
      - ".github/workflows/refresh-market-pulse-v9-6.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate_market_pulse.py"
      - "scripts/test_market_pulse_narrative.py"
      - "tests/test_market_pulse_diagnostics.py"
      - "scripts/validate_market_pulse.py"
      - "data/market_universe.json"
      - ".github/workflows/refresh-market-pulse-v9-6.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('market-pulse-pr-{0}', github.event.pull_request.number) || 'market-pulse-producer' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data dependencies
        run: python -m pip install --upgrade pip pandas yfinance
      - name: Validate narrative engine
        run: |
          python -m py_compile scripts/generate_market_pulse.py scripts/test_market_pulse_narrative.py scripts/validate_market_pulse.py
          python scripts/test_market_pulse_narrative.py
          python -m unittest tests.test_market_pulse_diagnostics -v
      - name: Backup last-known-good JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-backup
          for f in data/generated/market_pulse.json data/market_pulse.json site/data/market_pulse.json static/data/market_pulse.json; do
            [ -f "$f" ] && cp --parents "$f" .deploy-backup/
          done
      - name: Upload pre-refresh backup
        uses: actions/upload-artifact@v4
        with:
          name: market-pulse-backup-${{ github.run_id }}
          path: .deploy-backup
          if-no-files-found: warn
          retention-days: 30
      - name: Generate candidate JSON
        run: python scripts/generate_market_pulse.py
      - name: Validate candidate
        run: |
          python scripts/validate_market_pulse.py data/generated/market_pulse.json --min-ok-rate 0.75
          cmp data/generated/market_pulse.json data/market_pulse.json
          cmp data/generated/market_pulse.json site/data/market_pulse.json
          cmp data/generated/market_pulse.json static/data/market_pulse.json
      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: market-pulse-candidate-${{ github.run_id }}
          path: |
            data/generated/market_pulse.json
            data/market_pulse.json
            site/data/market_pulse.json
            static/data/market_pulse.json
          retention-days: 30
      - name: Build immutable production patch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-artifact
          git diff --binary HEAD -- data/generated/market_pulse.json data/market_pulse.json site/data/market_pulse.json static/data/market_pulse.json > publish-artifact/production-data.patch
          python scripts/validate_production_artifact.py create-metadata --patch publish-artifact/production-data.patch --metadata publish-artifact/metadata.json
      - name: Upload production patch
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7
      - name: Rehearse immutable artifact contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary HEAD -- data/generated/market_pulse.json data/market_pulse.json site/data/market_pulse.json static/data/market_pulse.json > /tmp/market-pulse.patch
          python - <<'PY'
          from pathlib import Path
          from scripts.validate_production_artifact import patch_paths, validate_paths
          patch = Path('/tmp/market-pulse.patch')
          paths = patch_paths(patch)
          validate_paths('Refresh Market Pulse v9.6', paths)
          print(f'Validated Market Pulse PR artifact paths: {paths or ["NO_CHANGES"]}')
          PY
