name: Verify Pages Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-pages-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify current public PR4 assets and payload
        env:
          BASE_URL: "https://rasita-th.github.io/stockcheck"
          EXPECTED_VERSION: "10.7.1"
        run: |
          set -euo pipefail

          verify_current_release() {
            local nonce="$1"
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 "${BASE_URL}/index.html?verify=${nonce}" -o /tmp/index.html || return 1
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 "${BASE_URL}/memo-only-fix.js?verify=${nonce}" -o /tmp/memo-only-fix.js || return 1
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 "${BASE_URL}/attention-pr4.js?verify=${nonce}" -o /tmp/attention-pr4.js || return 1
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 "${BASE_URL}/attention-pr4.css?verify=${nonce}" -o /tmp/attention-pr4.css || return 1
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 "${BASE_URL}/data/attention_today.json?verify=${nonce}" -o /tmp/attention_today.json || return 1

            grep -Fq "memo-only-fix.js?v=${EXPECTED_VERSION}" /tmp/index.html || return 1
            grep -Fq "attention-pr4.js?v=${EXPECTED_VERSION}" /tmp/memo-only-fix.js || return 1
            grep -Fq 'StockcheckAttentionP4' /tmp/attention-pr4.js || return 1
            grep -Fq 'สรุปสำหรับคุณ' /tmp/attention-pr4.js || return 1
            grep -Fq 'attention-p4-ready' /tmp/attention-pr4.css || return 1
            ! grep -Fq 'technical_json' /tmp/attention-pr4.js || return 1

            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/attention_today.json').read_text(encoding='utf-8'))
          contract = str(data.get('contract_version') or '')
          if not contract.startswith('3.0'):
              raise SystemExit(f'Expected Today contract 3.0, got {contract!r}')
          items = data.get('items')
          technical = data.get('technical_watch')
          if not isinstance(items, list) or not isinstance(technical, list):
              raise SystemExit('Today sections are missing')
          health = data.get('source_health') if isinstance(data.get('source_health'), dict) else {}
          if 'regulators' not in health:
              raise SystemExit('Regulator health missing')
          print(f"Verified contract {contract}: {len(items)} catalysts / {len(technical)} technical rows")
          PY
          }

          ready=false
          for attempt in $(seq 1 18); do
            nonce="$(date +%s)-${attempt}"
            echo "Pages verification attempt ${attempt}: ${BASE_URL}"
            if verify_current_release "$nonce"; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            echo "Current Pages release did not pass verification"
            exit 1
          fi
