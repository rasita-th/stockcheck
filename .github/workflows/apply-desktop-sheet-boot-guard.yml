name: Apply Desktop Sheet Boot Guard

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'fix/desktop-closed-sheets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Wire unique boot guard asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '  <script src="desktop-sheet-boot-guard-v10-8-6.js?v=10.8.6" defer></script>\n'
          anchor = '  <script src="memo-only-fix.js?v=9.5.4" defer></script>\n'
          for relative in ('site/index.html', 'static/index.html'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if tag not in text:
                  if anchor not in text:
                      raise SystemExit(f'{relative}: script anchor missing')
                  text = text.replace(anchor, anchor + tag, 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Strengthen browser smoke against visible startup sheets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/production_browser_smoke.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''      recoveryVersion: window.__stockcheckStorageRecoveryVersion || null,\n    };'''
          new = '''      recoveryVersion: window.__stockcheckStorageRecoveryVersion || null,\n      sheetBootGuard: window.__stockcheckDesktopSheetBootGuard || null,\n      visibleSheets: Array.from(document.querySelectorAll(".bottom-sheet")).filter((sheet) => {\n        const style = getComputedStyle(sheet);\n        const rect = sheet.getBoundingClientRect();\n        return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity || 1) > 0 && rect.width > 1 && rect.height > 1 && rect.right > 0 && rect.bottom > 0 && rect.left < innerWidth && rect.top < innerHeight;\n      }).map((sheet) => ({ id: sheet.id || null, ariaHidden: sheet.getAttribute("aria-hidden"), classes: sheet.className })),\n    };'''
          if old not in text and 'visibleSheets:' not in text:
              raise SystemExit('runtime insertion anchor missing')
          if 'visibleSheets:' not in text:
              text = text.replace(old, new, 1)
          old_fail = '''  if (status !== 200 || navigationError || pageErrors.length || criticalFailures.length || !runtime.shellVisible || runtime.bodyTextLength < 100 || (runtime.desktopRows + runtime.mobileCards) < 1) {\n    failed = true;\n  }'''
          new_fail = '''  if (status !== 200 || navigationError || pageErrors.length || criticalFailures.length || !runtime.shellVisible || runtime.bodyTextLength < 100 || (runtime.desktopRows + runtime.mobileCards) < 1 || (runtime.visibleSheets?.length || 0) > 0) {\n    failed = true;\n  }'''
          if old_fail not in text and '(runtime.visibleSheets?.length || 0) > 0' not in text:
              raise SystemExit('failure insertion anchor missing')
          if '(runtime.visibleSheets?.length || 0) > 0' not in text:
              text = text.replace(old_fail, new_fail, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source wiring
        run: |
          grep -F 'desktop-sheet-boot-guard-v10-8-6.js?v=10.8.6' site/index.html
          grep -F 'desktop-sheet-boot-guard-v10-8-6.js?v=10.8.6' static/index.html
          cmp site/desktop-sheet-boot-guard-v10-8-6.js static/desktop-sheet-boot-guard-v10-8-6.js
          grep -F 'visibleSheets:' tests/production_browser_smoke.mjs
          node --check site/desktop-sheet-boot-guard-v10-8-6.js

      - name: Commit hotfix wiring once
        run: |
          if git diff --quiet; then
            echo "Desktop sheet boot guard already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html static/index.html tests/production_browser_smoke.mjs
          git commit -m "Wire desktop sheet boot guard and visual smoke assertion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
