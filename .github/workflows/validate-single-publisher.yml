name: Validate Single Production Publisher

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_topology.py"
      - "scripts/validate_production_artifact.py"
      - "tests/test_production_artifact_contract.py"
      - "data/publisher-state.json"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_topology.py"
      - "scripts/validate_production_artifact.py"
      - "tests/test_production_artifact_contract.py"
      - "data/publisher-state.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile publisher controls
        run: python -m py_compile scripts/check_workflow_topology.py scripts/validate_production_artifact.py
      - name: Test production artifact contract
        run: python -m unittest tests.test_production_artifact_contract -v
      - name: Enforce repository workflow topology
        run: python scripts/check_workflow_topology.py
