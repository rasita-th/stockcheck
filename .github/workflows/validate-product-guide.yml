name: Validate Product Guide

on:
  push:
    branches: [main]
    paths:
      - 'site/product-guide.*'
      - 'static/product-guide.*'
      - 'site/index.html'
      - 'site/market.html'
      - 'scripts/prepare_stable_site_v9_4_1.py'
      - 'tests/product_guide_browser_smoke.py'
      - '.github/workflows/validate-product-guide.yml'
  pull_request:
    paths:
      - 'site/product-guide.*'
      - 'static/product-guide.*'
      - 'site/index.html'
      - 'site/market.html'
      - 'scripts/prepare_stable_site_v9_4_1.py'
      - 'tests/product_guide_browser_smoke.py'
      - '.github/workflows/validate-product-guide.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prepare the shipped Pages candidate
        run: |
          cmp site/product-guide.js static/product-guide.js
          cmp site/product-guide.css static/product-guide.css
          python scripts/prepare_stable_site_v9_4_1.py
          python scripts/sync_attention_assets.py
          python scripts/apply_runtime_asset_versions.py
      - name: Test all four tours on desktop and mobile
        run: |
          set -euo pipefail
          python -m http.server 8790 --bind 127.0.0.1 --directory site >/tmp/product-guide-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8790/ >/dev/null; then break; fi
            sleep 1
          done
          python tests/product_guide_browser_smoke.py --base-url http://127.0.0.1:8790
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-guide-browser-${{ github.run_id }}
          path: |
            /tmp/product-guide-*.png
            /tmp/product-guide-server.log
          if-no-files-found: warn
          retention-days: 14
