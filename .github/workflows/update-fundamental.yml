name: Update static fundamental data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"

permissions:
  contents: read

concurrency:
  group: fundamental-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate static fundamental data
        env:
          INCLUDE_FUNDAMENTALS: "1"
          FUNDAMENTAL_SCAN_WORKERS: "4"
          SEC_GUIDANCE_LOOKBACK_DAYS: "1460"
          SEC_GUIDANCE_MAX_FILINGS: "40"
          SEC_GUIDANCE_MAX_DOCUMENTS_PER_FILING: "8"
        run: python scripts/update_fundamental_data.py

      - name: Validate fundamental output
        run: |
          python -m py_compile scripts/update_fundamental_data.py scripts/validate_production_artifact.py
          python scripts/validate_static_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('site/data/fundamental.json')
          if not path.exists():
              raise SystemExit('site/data/fundamental.json was not generated')
          json.loads(path.read_text(encoding='utf-8'))
          print('Fundamental JSON is present and valid.')
          PY

      - name: Build immutable production artifact
        run: |
          set -euo pipefail
          mkdir -p publish-artifact
          git diff --binary HEAD -- site/data/fundamental.json \
            > publish-artifact/production-data.patch
          python scripts/validate_production_artifact.py create-metadata \
            --patch publish-artifact/production-data.patch \
            --metadata publish-artifact/metadata.json

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7
