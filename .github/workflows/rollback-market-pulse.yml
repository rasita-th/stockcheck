name: Roll back Market Pulse data

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Known-good commit or tag to restore Market Pulse JSON from"
        required: true
      reason:
        description: "Reason for the production rollback"
        required: true
      confirm:
        description: "Type ROLLBACK to confirm"
        required: true

permissions:
  contents: write

concurrency:
  group: production-publisher
  cancel-in-progress: false

jobs:
  rollback:
    if: inputs.confirm == 'ROLLBACK'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate rollback request and restore JSON
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test -n "$REASON"
          git rev-parse --verify "$SOURCE_REF^{commit}"
          for f in data/market_pulse.json site/data/market_pulse.json static/data/market_pulse.json; do
            git cat-file -e "$SOURCE_REF:$f"
            git show "$SOURCE_REF:$f" > "$f"
          done
          python scripts/validate_market_pulse.py data/market_pulse.json --min-ok-rate 0.70
          cmp data/market_pulse.json site/data/market_pulse.json
          cmp data/market_pulse.json static/data/market_pulse.json

      - name: Commit rollback under the production lock
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_pulse.json site/data/market_pulse.json static/data/market_pulse.json
          if git diff --cached --quiet; then
            echo "Selected ref matches current Market Pulse data; no rollback commit needed."
            exit 0
          fi
          git commit -m "data: roll back Market Pulse from ${SOURCE_REF}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
