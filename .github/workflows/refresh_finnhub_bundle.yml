name: Refresh Finnhub Full Backfill

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finnhub-backfill-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Test unified Finnhub pipeline
        run: |
          python -m py_compile scripts/finnhub_pipeline.py scripts/compact_finnhub_state.py scripts/finnhub_sharded_state.py scripts/check_generated_file_sizes.py scripts/validate_production_artifact.py
          python -m unittest tests.test_finnhub_pipeline tests.test_finnhub_compaction tests.test_finnhub_sharded_state
      - name: Hydrate ephemeral Finnhub working state
        run: python scripts/finnhub_sharded_state.py hydrate
      - name: Run full dual-key backfill
        env:
          FINNHUB_API_KEY_EVENTS: ${{ secrets.FINNHUB_API_KEY_EVENTS || secrets.FINNHUB_API_KEY }}
          FINNHUB_API_KEY_ANALYST: ${{ secrets.FINNHUB_API_KEY_ANALYST || secrets.FINNHUB_API_KEY_2 || secrets.FINNHUB_API_KEY }}
          FINNHUB_EVENTS_MAX_CALLS_PER_RUN: "48"
          FINNHUB_ANALYST_MAX_CALLS_PER_RUN: "48"
          FINNHUB_MIN_DELAY_SECONDS: "1.25"
        run: python scripts/finnhub_pipeline.py --mode all
      - name: Compact Finnhub state and public projection
        run: python scripts/compact_finnhub_state.py --write
      - name: Publish sharded Finnhub state
        run: python scripts/finnhub_sharded_state.py shard --delete-legacy
      - name: Enforce Finnhub output size budgets
        run: |
          mapfile -t shard_files < <(find data/finnhub/state -type f -name '*.json' -print | sort)
          python scripts/check_generated_file_sizes.py "${shard_files[@]}" data/finnhub_features.json site/data/finnhub_features.json static/data/finnhub_features.json
      - name: Validate backfill contracts
        run: |
          test ! -e data/finnhub/state.json
          test -f data/finnhub/state/index.json
          python scripts/validate_static_data.py
      - name: Build immutable production artifact
        run: |
          set -euo pipefail
          mkdir -p publish-artifact
          git add -N -- data/finnhub/state
          git diff --binary HEAD -- data/finnhub data/earnings_calendar.json data/eps_surprises.json data/recommendation_trends.json data/finnhub_features.json site/data/earnings_calendar.json site/data/eps_surprises.json site/data/recommendation_trends.json site/data/finnhub_features.json static/data/earnings_calendar.json static/data/eps_surprises.json static/data/recommendation_trends.json static/data/finnhub_features.json > publish-artifact/production-data.patch
          grep -q 'data/finnhub/state/index.json' publish-artifact/production-data.patch
          if grep -q 'a/data/finnhub/state.json b/data/finnhub/state.json' publish-artifact/production-data.patch; then
            python scripts/check_generated_file_sizes.py --patch-hard-limit-mib 50 publish-artifact/production-data.patch
          else
            python scripts/check_generated_file_sizes.py publish-artifact/production-data.patch
          fi
          python scripts/validate_production_artifact.py create-metadata --patch publish-artifact/production-data.patch --metadata publish-artifact/metadata.json
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7
