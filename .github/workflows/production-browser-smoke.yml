name: Production Browser Smoke

on:
  pull_request:
    paths:
      - "tests/production_browser_smoke.mjs"
      - ".github/workflows/production-browser-smoke.yml"
      - "site/**"
      - "static/**"
      - "scripts/prepare_stable_site_v9_4_1.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://rasita-th.github.io/stockcheck/
      SMOKE_OUT_DIR: production-smoke-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Reproduce production load
        run: node tests/production_browser_smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: production-smoke-artifacts
          if-no-files-found: warn
