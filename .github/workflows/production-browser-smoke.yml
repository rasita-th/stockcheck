name: Production Browser Smoke

on:
  pull_request:
    paths:
      - "tests/production_browser_smoke.mjs"
      - "tests/primary_navigation_smoke.mjs"
      - "tests/primary_navigation_diagnostic.mjs"
      - ".github/workflows/production-browser-smoke.yml"
      - "site/**"
      - "static/**"
      - "scripts/prepare_stable_site_v9_4_1.py"
      - "config/release-manifest.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_OUT_DIR: production-smoke-artifacts
      NAV_SMOKE_OUT_DIR: primary-navigation-smoke-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare candidate browser artifact
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_stable_site_v9_4_1.py
          python3 scripts/sync_attention_assets.py
          rm -rf /tmp/stockcheck-browser-candidate
          cp -a site /tmp/stockcheck-browser-candidate
          node --check /tmp/stockcheck-browser-candidate/storage-guard-v10-8-4.js
          node --check /tmp/stockcheck-browser-candidate/app-shell-v9-4-6.js
          grep -F 'app-shell-v9-4-6.js?v=10.8.7' /tmp/stockcheck-browser-candidate/index.html
          grep -F 'storage-guard-v10-8-4.js?v=10.8.7' /tmp/stockcheck-browser-candidate/index.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/stockcheck-browser-candidate/index.html').read_text(encoding='utf-8')
          shell = html.index('app-shell-v9-4-6.js?v=10.8.7')
          guard = html.index('storage-guard-v10-8-4.js?v=10.8.7')
          app = html.index('app.js?v=10.8.7')
          assert shell < guard < app, (shell, guard, app)
          PY

      - name: Start candidate server
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -m http.server 8000 --directory /tmp/stockcheck-browser-candidate >/tmp/stockcheck-smoke-server.log 2>&1 &
          echo $! > /tmp/stockcheck-smoke-server.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stockcheck-smoke-server.log
          exit 1

      - name: Diagnose candidate primary-navigation hang
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRODUCTION_URL: http://127.0.0.1:8000/
        run: |
          set +e
          mkdir -p primary-navigation-smoke-artifacts
          : > primary-navigation-smoke-artifacts/diagnostic-summary.txt
          for mode in none drawdown memo-only final-ui attention-p0 attention-pr3 attention-pr4; do
            echo "===== mode=${mode} =====" | tee -a primary-navigation-smoke-artifacts/diagnostic-summary.txt
            timeout --signal=KILL 45s env BLOCK_RUNTIME="${mode}" node tests/primary_navigation_diagnostic.mjs > "primary-navigation-smoke-artifacts/diag-${mode}.log" 2>&1
            code=$?
            cat "primary-navigation-smoke-artifacts/diag-${mode}.log"
            echo "mode=${mode} exit=${code}" | tee -a primary-navigation-smoke-artifacts/diagnostic-summary.txt
          done
          cat primary-navigation-smoke-artifacts/diagnostic-summary.txt
          echo "Diagnostic-only run: keep PR red until a causal component is isolated and fixed."
          exit 1

      - name: Verify candidate primary navigation
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRODUCTION_URL: http://127.0.0.1:8000/
        run: node tests/primary_navigation_smoke.mjs

      - name: Verify candidate browser bootstrap
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRODUCTION_URL: http://127.0.0.1:8000/
        run: node tests/production_browser_smoke.mjs

      - name: Verify deployed primary navigation
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PRODUCTION_URL: https://rasita-th.github.io/stockcheck/
        run: node tests/primary_navigation_smoke.mjs

      - name: Verify deployed production browser bootstrap
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PRODUCTION_URL: https://rasita-th.github.io/stockcheck/
        run: node tests/production_browser_smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke-${{ github.run_id }}
          path: |
            production-smoke-artifacts
            primary-navigation-smoke-artifacts
          if-no-files-found: warn
