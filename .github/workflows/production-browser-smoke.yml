name: Production Browser Smoke

on:
  pull_request:
    paths:
      - "tests/production_browser_smoke.mjs"
      - "tests/primary_navigation_smoke.mjs"
      - "tests/stock_detail_primary_nav_smoke.mjs"
      - ".github/workflows/production-browser-smoke.yml"
      - "site/**"
      - "static/**"
      - "scripts/prepare_stable_site_v9_4_1.py"
      - "config/release-manifest.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_OUT_DIR: production-smoke-artifacts
      NAV_SMOKE_OUT_DIR: primary-navigation-smoke-artifacts
      DETAIL_NAV_SMOKE_OUT_DIR: stock-detail-primary-nav-smoke-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare exact candidate Pages artifact
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_stable_site_v9_4_1.py
          python3 scripts/sync_attention_assets.py
          rm -rf /tmp/stockcheck-browser-candidate
          cp -a site /tmp/stockcheck-browser-candidate
          node --check /tmp/stockcheck-browser-candidate/storage-guard-v10-8-4.js
          node --check /tmp/stockcheck-browser-candidate/final-ui-coordinator.js
          grep -F 'final-ui-coordinator.js?v=10.8.4' /tmp/stockcheck-browser-candidate/index.html
          grep -F 'storage-guard-v10-8-4.js?v=10.8.4' /tmp/stockcheck-browser-candidate/index.html

      - name: Start candidate server
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -m http.server 8000 --directory /tmp/stockcheck-browser-candidate >/tmp/stockcheck-smoke-server.log 2>&1 &
          echo $! > /tmp/stockcheck-smoke-server.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stockcheck-smoke-server.log
          exit 1

      - name: Verify candidate primary navigation
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRODUCTION_URL: http://stockcheck.localhost:8000/
        run: node tests/primary_navigation_smoke.mjs

      - name: Verify candidate Stock Detail primary navigation
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRODUCTION_URL: http://stockcheck.localhost:8000/
        run: node tests/stock_detail_primary_nav_smoke.mjs

      - name: Verify candidate browser bootstrap
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PRODUCTION_URL: http://stockcheck.localhost:8000/
        run: node tests/production_browser_smoke.mjs

      - name: Verify deployed primary navigation
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PRODUCTION_URL: https://rasita-th.github.io/stockcheck/
        run: node tests/primary_navigation_smoke.mjs

      - name: Verify deployed Stock Detail primary navigation
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PRODUCTION_URL: https://rasita-th.github.io/stockcheck/
        run: node tests/stock_detail_primary_nav_smoke.mjs

      - name: Verify deployed production browser bootstrap
        if: ${{ github.event_name != 'pull_request' }}
        env:
          PRODUCTION_URL: https://rasita-th.github.io/stockcheck/
        run: node tests/production_browser_smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke-${{ github.run_id }}
          path: |
            production-smoke-artifacts
            primary-navigation-smoke-artifacts
            stock-detail-primary-nav-smoke-artifacts
          if-no-files-found: warn
