name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  TODAY_DEPLOY_VERSION: "10.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare clean Pages artifact
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare_stable_site_v9_4_1.py scripts/sync_attention_assets.py
          python scripts/prepare_stable_site_v9_4_1.py
          python scripts/sync_attention_assets.py

      - name: Inject optional Logo.dev publishable token
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("LOGO_DEV_TOKEN", "").strip()
          replacement = token if token.startswith("pk_") else ""
          placeholder = "__LOGO_DEV_PUBLISHABLE_KEY__"
          for relative in ("site/attention-pr4.js", "static/attention-pr4.js"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(placeholder)
              if count > 1:
                  raise SystemExit(f"{relative}: duplicate Logo.dev placeholders")
              if count == 1:
                  path.write_text(text.replace(placeholder, replacement), encoding="utf-8")
          if replacement:
              print("Logo.dev publishable token injected")
          else:
              print("LOGO_DEV missing/invalid; ticker-initial fallback remains available")
          PY

      - name: Validate deployable application and data
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check site/app-shell-v9-4-6.js
          node --check site/market.js
          node --check site/notification-phase2.js
          node --check site/final-ui-coordinator.js
          node --check site/memo-only-fix.js
          node --check site/attention-p0.js
          node --check site/attention-pr3.js
          node --check site/attention-pr4.js
          node --check site/earnings-radar-pr4.js
          python scripts/validate_static_data.py
          python scripts/validate_earnings_radar.py
          python scripts/smoke_test_site_v9_4_6.py
          python scripts/check_ui_view_contract.py
          python scripts/check_earnings_radar_ui_contract.py
          python scripts/check_earnings_radar_activation.py

      - name: Stamp immutable production identity
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          attention = json.loads(Path("site/data/attention_today.json").read_text(encoding="utf-8"))
          market = json.loads(Path("site/data/market_pulse.json").read_text(encoding="utf-8"))
          identity = {
              "schema_version": "1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "built_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "attention_updated_at": attention.get("updated_at"),
              "market_generated_at": market.get("generated_at"),
              "asset_version": os.environ["TODAY_DEPLOY_VERSION"],
          }
          Path("site/build.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(identity, ensure_ascii=False))
          PY

      - name: Add nojekyll marker
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 18
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed commit and data identity
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          test -n "$BASE"
          ready=false
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-${attempt}"
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/build.json?smoke=${nonce}" -o /tmp/build.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/attention_today.json?smoke=${nonce}" -o /tmp/attention_today.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/market_pulse.json?smoke=${nonce}" -o /tmp/market_pulse.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/index.html?smoke=${nonce}" -o /tmp/index.html; then
              if python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          build = json.loads(Path('/tmp/build.json').read_text(encoding='utf-8'))
          attention = json.loads(Path('/tmp/attention_today.json').read_text(encoding='utf-8'))
          market = json.loads(Path('/tmp/market_pulse.json').read_text(encoding='utf-8'))
          expected = os.environ['GITHUB_SHA']
          if build.get('source_commit') != expected:
              raise SystemExit(f"commit mismatch: {build.get('source_commit')} != {expected}")
          if build.get('attention_updated_at') != attention.get('updated_at'):
              raise SystemExit('attention identity mismatch')
          if build.get('market_generated_at') != market.get('generated_at'):
              raise SystemExit('market identity mismatch')
          stamp = str(attention.get('updated_at') or '')
          updated = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
          age_hours = (datetime.now(timezone.utc) - updated).total_seconds() / 3600
          if age_hours < -0.25 or age_hours > 6:
              raise SystemExit(f'attention data is stale: {age_hours:.2f} hours')
          if Path('/tmp/index.html').stat().st_size < 1000:
              raise SystemExit('index.html is unexpectedly small')
          print(f"Verified production commit {expected}; attention age {age_hours:.2f}h")
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "Production did not serve commit ${GITHUB_SHA} with matching current data" >&2
            exit 1
          fi

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-receipt-${{ github.run_id }}
          path: /tmp/build.json
          if-no-files-found: error
          retention-days: 30
