name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  TODAY_DEPLOY_VERSION: "10.8.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align artifact builder to release manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare_stable_site_v9_4_1.py')
          text = path.read_text(encoding='utf-8')
          old = 'VERSION = "10.8.1"'
          new = 'VERSION = "10.8.2"'
          if old not in text and new not in text:
              raise SystemExit('prepare script VERSION contract not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Prepare clean Pages artifact
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare_stable_site_v9_4_1.py scripts/sync_attention_assets.py
          python scripts/prepare_stable_site_v9_4_1.py
          python scripts/sync_attention_assets.py

      - name: Inject optional Logo.dev publishable token
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          token = os.environ.get('LOGO_DEV_TOKEN', '').strip()
          replacement = token if token.startswith('pk_') else ''
          placeholder = '__LOGO_DEV_PUBLISHABLE_KEY__'
          for relative in ('site/attention-pr4.js', 'static/attention-pr4.js'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              count = text.count(placeholder)
              if count > 1:
                  raise SystemExit(f'{relative}: duplicate Logo.dev placeholders')
              if count == 1:
                  path.write_text(text.replace(placeholder, replacement), encoding='utf-8')
          PY

      - name: Validate deployable application and data
        run: |
          set -euo pipefail
          node --check site/storage-guard-v10-7-3.js
          node --check site/app.js
          node --check site/technical-shards-v2.js
          node tests/technical_shards_runtime.test.js
          node tests/memo_canonical_price_runtime.test.js
          node tests/stock_detail_drawer_contract.test.js
          node --check site/app-shell-v9-4-6.js
          node --check site/market.js
          node --check site/notification-phase2.js
          node --check site/final-ui-coordinator.js
          node --check site/memo-only-fix.js
          node --check site/attention-p0.js
          node --check site/attention-pr3.js
          node --check site/attention-pr4.js
          node --check site/earnings-radar-pr4.js
          python scripts/validate_static_data.py
          python scripts/validate_earnings_radar.py
          python scripts/smoke_test_site_v9_4_6.py
          python scripts/check_ui_view_contract.py
          python scripts/check_earnings_radar_ui_contract.py
          python scripts/check_earnings_radar_activation.py
          grep -F 'final-ui-coordinator.js?v=10.8.2' site/index.html
          grep -F 'final-ui-coordinator.css?v=10.8.2' site/index.html

      - name: Stamp immutable production identity
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          attention = json.loads(Path('site/data/attention_today.json').read_text(encoding='utf-8'))
          market = json.loads(Path('site/data/market_pulse.json').read_text(encoding='utf-8'))
          technical = json.loads(Path('site/data/technical/index.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('config/release-manifest.json').read_text(encoding='utf-8'))
          rows = technical.get('rows') or []
          technical_samples = {}
          for symbol in ('NVDA', 'CIFR'):
              row = next(item for item in rows if str(item.get('symbol') or item.get('ticker')).upper() == symbol)
              shard = json.loads(Path(f'site/data/technical/symbols/{symbol}.json').read_text(encoding='utf-8'))
              technical_samples[symbol] = {
                  'close': row.get('close'),
                  'series_points': len(shard.get('series') or []),
              }
          identity = {
              'schema_version': '1.2',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'built_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'attention_updated_at': attention.get('updated_at'),
              'market_generated_at': market.get('generated_at'),
              'technical_generated_at': technical.get('generatedAtTechnical') or technical.get('generatedAt'),
              'technical_count': len(rows),
              'technical_asset_version': manifest['assets']['technical_shards_js'],
              'technical_samples': technical_samples,
              'asset_version': os.environ['TODAY_DEPLOY_VERSION'],
              'drawdown_runtime': '10.8.2',
          }
          Path("site/build.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(identity, ensure_ascii=False))
          PY

      - name: Add nojekyll marker
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 18
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed prices technical data and Drawdown runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          ready=false
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-${attempt}"
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/build.json?smoke=${nonce}" -o /tmp/build.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/attention_today.json?smoke=${nonce}" -o /tmp/attention_today.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/market_pulse.json?smoke=${nonce}" -o /tmp/market_pulse.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/technical/index.json?smoke=${nonce}" -o /tmp/technical_index.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/technical/symbols/NVDA.json?smoke=${nonce}" -o /tmp/nvda.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/technical/symbols/CIFR.json?smoke=${nonce}" -o /tmp/cifr.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/index.html?smoke=${nonce}" -o /tmp/index.html \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/final-ui-coordinator.js?smoke=${nonce}" -o /tmp/coordinator.js; then
              if python - <<'PY'
          import json
          import os
          from pathlib import Path
          build = json.loads(Path('/tmp/build.json').read_text(encoding='utf-8'))
          attention = json.loads(Path('/tmp/attention_today.json').read_text(encoding='utf-8'))
          market = json.loads(Path('/tmp/market_pulse.json').read_text(encoding='utf-8'))
          technical = json.loads(Path('/tmp/technical_index.json').read_text(encoding='utf-8'))
          shards = {
              'NVDA': json.loads(Path('/tmp/nvda.json').read_text(encoding='utf-8')),
              'CIFR': json.loads(Path('/tmp/cifr.json').read_text(encoding='utf-8')),
          }
          index = Path('/tmp/index.html').read_text(encoding='utf-8')
          runtime = Path('/tmp/coordinator.js').read_text(encoding='utf-8')
          if build.get('source_commit') != os.environ['GITHUB_SHA']:
              raise SystemExit('commit mismatch')
          if build.get('attention_updated_at') != attention.get('updated_at'):
              raise SystemExit('attention identity mismatch')
          if build.get('market_generated_at') != market.get('generated_at'):
              raise SystemExit('market identity mismatch')
          technical_stamp = technical.get('generatedAtTechnical') or technical.get('generatedAt')
          if build.get('technical_generated_at') != technical_stamp:
              raise SystemExit('technical identity mismatch')
          if build.get('asset_version') != '10.8.2':
              raise SystemExit('production asset version mismatch')
          if 'final-ui-coordinator.js?v=10.8.2' not in index:
              raise SystemExit('production HTML missing coordinator v10.8.2')
          for token in ('const VERSION = "10.8.2"', 'drawdownData', 'data-drawdown-panel', 'StockRadarDrawdown', 'StockRadarDetailPresentation'):
              if token not in runtime:
                  raise SystemExit(f'production coordinator runtime missing: {token}')
          rows = technical.get('rows') or []
          samples = build.get('technical_samples') or {}
          for symbol, shard in shards.items():
              row = next((item for item in rows if str(item.get('symbol') or item.get('ticker')).upper() == symbol), None)
              if not isinstance(row, dict):
                  raise SystemExit(f'{symbol} missing from deployed technical index')
              series = shard.get('series')
              if not isinstance(series, list) or len(series) < 30:
                  raise SystemExit(f'{symbol} chart history is missing')
              latest = shard.get('latest') or {}
              if not isinstance(latest.get('close'), (int, float)):
                  raise SystemExit(f'{symbol} shard price is missing')
              if abs(float(row.get('close')) - float(latest.get('close'))) > 0.01:
                  raise SystemExit(f'{symbol} summary and chart prices disagree')
              sample = samples.get(symbol) or {}
              if sample.get('series_points') != len(series):
                  raise SystemExit(f'{symbol} chart identity mismatch')
          print('Verified production coordinator runtime 10.8.2 with NVDA and CIFR chart history')
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = "true"

  verify-core:
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    timeout-minutes: 12
    steps:
      - name: Checkout deployed production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify market-wide production screener contract
        id: core
        continue-on-error: true
        env:
          BASE_URL: https://rasita-th.github.io/stockcheck
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stockcheck-core/shards
          nonce="${GITHUB_RUN_ID}-$(date +%s)"
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 \
            "${BASE_URL}/build.json?core=${nonce}" -o /tmp/stockcheck-core/build.json
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 \
            "${BASE_URL}/data/screener_snapshot.json?core=${nonce}" -o /tmp/stockcheck-core/screener_snapshot.json
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 \
            "${BASE_URL}/data/quote_latest.json?core=${nonce}" -o /tmp/stockcheck-core/quote_latest.json
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 \
            "${BASE_URL}/data/technical.json?core=${nonce}" -o /tmp/stockcheck-core/technical.json
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 \
            "${BASE_URL}/technical-shards-v2.js?core=${nonce}" -o /tmp/stockcheck-core/technical-shards-v2.js
          for symbol in AMD ZETA NVDA CIFR; do
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 \
              "${BASE_URL}/data/technical/symbols/${symbol}.json?core=${nonce}" \
              -o "/tmp/stockcheck-core/shards/${symbol}.json"
          done
          expected_runtime="$(python -c 'import json; print(json.load(open("config/release-manifest.json", encoding="utf-8"))["assets"]["technical_shards_js"])')"
          expected_snapshot_schema="$(python -c 'import json; print(json.load(open("config/release-manifest.json", encoding="utf-8"))["data_contracts"]["screener_snapshot"])')"
          python scripts/verify_screener_snapshot.py \
            --snapshot /tmp/stockcheck-core/screener_snapshot.json \
            --quotes /tmp/stockcheck-core/quote_latest.json \
            --technical /tmp/stockcheck-core/technical.json \
            --runtime /tmp/stockcheck-core/technical-shards-v2.js \
            --build /tmp/stockcheck-core/build.json \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-snapshot-schema "$expected_snapshot_schema" \
            --expected-runtime "$expected_runtime" \
            --quote-freshness-policy market-hours \
            --shard /tmp/stockcheck-core/shards/AMD.json \
            --shard /tmp/stockcheck-core/shards/ZETA.json \
            --shard /tmp/stockcheck-core/shards/NVDA.json \
            --shard /tmp/stockcheck-core/shards/CIFR.json \
            --summary-output /tmp/stockcheck-core/verification.json

      - name: Publish core production status
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.core.outcome }}
        with:
          script: |
            const ok = process.env.VERIFY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'production/stockcheck-core',
              description: ok
                ? 'Core verified: fresh screener, filters and alerts share canonical data'
                : 'Core failed: canonical screener production contract is not valid',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!ok) core.setFailed('Production screener verification failed');

      - name: Upload core verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-screener-receipt-${{ github.run_id }}
          path: /tmp/stockcheck-core
          if-no-files-found: warn
          retention-days: 30

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Publish verified deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          state=failure
          description="Production deployment failed"
          if [ "$RESULT" = "success" ]; then
            state=success
            description="Production deployment verified"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="production/stockcheck-pages" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
