name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  TODAY_DEPLOY_VERSION: "10.7.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare clean Pages artifact
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare_stable_site_v9_4_1.py scripts/sync_attention_assets.py
          python scripts/prepare_stable_site_v9_4_1.py
          python scripts/sync_attention_assets.py

      - name: Inject optional Logo.dev publishable token
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("LOGO_DEV_TOKEN", "").strip()
          replacement = token if token.startswith("pk_") else ""
          placeholder = "__LOGO_DEV_PUBLISHABLE_KEY__"
          for relative in ("site/attention-pr4.js", "static/attention-pr4.js"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(placeholder)
              if count > 1:
                  raise SystemExit(f"{relative}: duplicate Logo.dev placeholders")
              if count == 1:
                  path.write_text(text.replace(placeholder, replacement), encoding="utf-8")
          if replacement:
              print("Logo.dev publishable token injected")
          else:
              print("LOGO_DEV missing/invalid; ticker-initial fallback remains available")
          PY

      - name: Validate deployable application and data
        run: |
          set -euo pipefail
          node --check site/storage-guard-v10-7-3.js
          node --check site/app.js
          node --check site/technical-shards-v2.js
          node --check site/app-shell-v9-4-6.js
          node --check site/market.js
          node --check site/notification-phase2.js
          node --check site/final-ui-coordinator.js
          node --check site/memo-only-fix.js
          node --check site/attention-p0.js
          node --check site/attention-pr3.js
          node --check site/attention-pr4.js
          node --check site/earnings-radar-pr4.js
          python scripts/validate_static_data.py
          python scripts/validate_earnings_radar.py
          python scripts/smoke_test_site_v9_4_6.py
          python scripts/check_ui_view_contract.py
          python scripts/check_earnings_radar_ui_contract.py
          python scripts/check_earnings_radar_activation.py

      - name: Stamp immutable production identity
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          attention = json.loads(Path("site/data/attention_today.json").read_text(encoding="utf-8"))
          market = json.loads(Path("site/data/market_pulse.json").read_text(encoding="utf-8"))
          technical = json.loads(Path("site/data/technical/index.json").read_text(encoding="utf-8"))
          nvda = next(
              row for row in technical["rows"]
              if str(row.get("symbol") or row.get("ticker")).upper() == "NVDA"
          )
          nvda_shard = json.loads(Path("site/data/technical/symbols/NVDA.json").read_text(encoding="utf-8"))
          identity = {
              "schema_version": "1.1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "built_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "attention_updated_at": attention.get("updated_at"),
              "market_generated_at": market.get("generated_at"),
              "technical_generated_at": technical.get("generatedAtTechnical") or technical.get("generatedAt"),
              "technical_count": len(technical.get("rows") or []),
              "nvda_close": nvda.get("close"),
              "nvda_series_points": len(nvda_shard.get("series") or []),
              "asset_version": os.environ["TODAY_DEPLOY_VERSION"],
          }
          Path("site/build.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(identity, ensure_ascii=False))
          PY

      - name: Add nojekyll marker
        run: touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 18
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed prices technical data and charts
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ env.TODAY_DEPLOY_VERSION }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          test -n "$BASE"
          ready=false
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-${attempt}"
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/build.json?smoke=${nonce}" -o /tmp/build.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/attention_today.json?smoke=${nonce}" -o /tmp/attention_today.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/market_pulse.json?smoke=${nonce}" -o /tmp/market_pulse.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/technical/index.json?smoke=${nonce}" -o /tmp/technical_index.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/data/technical/symbols/NVDA.json?smoke=${nonce}" -o /tmp/nvda.json \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/index.html?smoke=${nonce}" -o /tmp/index.html \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/market.html?smoke=${nonce}" -o /tmp/market.html \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/app.js?smoke=${nonce}" -o /tmp/app.js \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/market.js?smoke=${nonce}" -o /tmp/market.js \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/storage-guard-v10-7-3.js?smoke=${nonce}" -o /tmp/storage-guard.js \
              && curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "${BASE}/technical-shards-v2.js?smoke=${nonce}" -o /tmp/technical-shards-v2.js; then
              if python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          build = json.loads(Path('/tmp/build.json').read_text(encoding='utf-8'))
          attention = json.loads(Path('/tmp/attention_today.json').read_text(encoding='utf-8'))
          market = json.loads(Path('/tmp/market_pulse.json').read_text(encoding='utf-8'))
          technical = json.loads(Path('/tmp/technical_index.json').read_text(encoding='utf-8'))
          nvda_shard = json.loads(Path('/tmp/nvda.json').read_text(encoding='utf-8'))
          index = Path('/tmp/index.html').read_text(encoding='utf-8')
          market_html = Path('/tmp/market.html').read_text(encoding='utf-8')
          app = Path('/tmp/app.js').read_text(encoding='utf-8')
          market_runtime = Path('/tmp/market.js').read_text(encoding='utf-8')
          guard = Path('/tmp/storage-guard.js').read_text(encoding='utf-8')
          shard_runtime = Path('/tmp/technical-shards-v2.js').read_text(encoding='utf-8')

          expected_commit = os.environ['GITHUB_SHA']
          expected_version = os.environ['EXPECTED_VERSION']
          if build.get('source_commit') != expected_commit:
              raise SystemExit(f"commit mismatch: {build.get('source_commit')} != {expected_commit}")
          if build.get('asset_version') != expected_version:
              raise SystemExit('asset version mismatch')
          if build.get('attention_updated_at') != attention.get('updated_at'):
              raise SystemExit('attention identity mismatch')
          if build.get('market_generated_at') != market.get('generated_at'):
              raise SystemExit('market identity mismatch')
          technical_stamp = technical.get('generatedAtTechnical') or technical.get('generatedAt')
          if build.get('technical_generated_at') != technical_stamp:
              raise SystemExit('technical identity mismatch')

          guard_ref = f'storage-guard-v10-7-3.js?v={expected_version}'
          app_ref = f'app.js?v={expected_version}'
          market_ref = f'market.js?v={expected_version}'
          technical_ref = f'technical-shards-v2.js?v={expected_version}'
          for html, bootstrap_ref, page in (
              (index, app_ref, 'index.html'),
              (market_html, market_ref, 'market.html'),
          ):
              if guard_ref not in html or bootstrap_ref not in html:
                  raise SystemExit(f'{page} runtime references are missing')
              if html.find(guard_ref) > html.find(bootstrap_ref):
                  raise SystemExit(f'{page} storage guard loads after bootstrap')
          if technical_ref not in index:
              raise SystemExit('technical shard runtime reference is missing')
          if '__stockcheckStorageMode' not in guard or 'Object.defineProperty(window, "localStorage"' not in guard:
              raise SystemExit('storage fallback runtime is invalid')
          for token in ('loadStaticData', 'fetchStaticLayer', 'mergeStaticPayloads', 'renderAll'):
              if token not in app:
                  raise SystemExit(f'app runtime missing {token}')
          if 'loadTechnicalShard' not in shard_runtime or 'data/technical/symbols/' not in shard_runtime:
              raise SystemExit('technical shard loader runtime is invalid')
          if 'localStorage' not in market_runtime:
              raise SystemExit('unexpected Market Pulse runtime contract')

          rows = technical.get('rows')
          if technical.get('schema_version') != '2.0' or not isinstance(rows, list) or not rows:
              raise SystemExit('deployed technical index is invalid')
          nvda = next((row for row in rows if str(row.get('symbol') or row.get('ticker')).upper() == 'NVDA'), None)
          if not isinstance(nvda, dict):
              raise SystemExit('NVDA missing from deployed technical index')
          for key in ('close', 'ema20', 'rsi14'):
              if not isinstance(nvda.get(key), (int, float)):
                  raise SystemExit(f'NVDA {key} is missing from deployed technical index')
          if float(nvda['close']) <= 0:
              raise SystemExit('NVDA deployed price is invalid')
          series = nvda_shard.get('series')
          latest = nvda_shard.get('latest') or {}
          if nvda_shard.get('schema_version') != '2.0' or nvda_shard.get('symbol') != 'NVDA':
              raise SystemExit('deployed NVDA shard contract is invalid')
          if not isinstance(series, list) or len(series) < 30:
              raise SystemExit('deployed NVDA chart history is missing')
          if not isinstance(latest.get('close'), (int, float)):
              raise SystemExit('deployed NVDA shard price is missing')
          if abs(float(nvda['close']) - float(latest['close'])) > 0.01:
              raise SystemExit('NVDA summary and chart prices disagree')
          if build.get('technical_count') != len(rows):
              raise SystemExit('technical row-count identity mismatch')
          if build.get('nvda_close') != nvda.get('close'):
              raise SystemExit('NVDA price identity mismatch')
          if build.get('nvda_series_points') != len(series):
              raise SystemExit('NVDA chart identity mismatch')

          stamp = str(attention.get('updated_at') or '')
          updated = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
          age_hours = (datetime.now(timezone.utc) - updated).total_seconds() / 3600
          if age_hours < -0.25 or age_hours > 6:
              raise SystemExit(f'attention data is stale: {age_hours:.2f} hours')
          if len(index) < 1000 or len(app) < 1000:
              raise SystemExit('production application assets are unexpectedly small')
          print(
              f"Verified production {expected_commit}: {len(rows)} technical rows, "
              f"NVDA ${nvda['close']}, {len(series)} chart points, attention age {age_hours:.2f}h"
          )
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "Production did not serve commit ${GITHUB_SHA} with working prices, technical data and charts" >&2
            exit 1
          fi

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-receipt-${{ github.run_id }}
          path: /tmp/build.json
          if-no-files-found: error
          retention-days: 30

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Publish verified deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build.result }}';
            const deployResult = '${{ needs.deploy.result }}';
            const ok = buildResult === 'success' && deployResult === 'success';
            const targetUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'production/stockcheck-pages',
              description: ok
                ? 'Pages verified: prices, technical data and charts available'
                : `Pages failed: build=${buildResult}, deploy=${deployResult}`,
              target_url: targetUrl,
            });
            if (!ok) {
              core.setFailed(`Pages deployment failed: build=${buildResult}, deploy=${deployResult}`);
            }
