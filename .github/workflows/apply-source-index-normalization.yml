name: Apply Source Index Normalization

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/production-load-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove prepared-only guard tags from source HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = '  <script src="storage-guard-v10-8-4.js?v=10.8.4"></script>\n'
          for relative in ('site/index.html', 'static/index.html'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(tag, ''), encoding='utf-8')
          PY
          python3 scripts/check_ui_view_contract.py

      - name: Commit normalization once
        run: |
          if git diff --quiet; then
            echo "Source HTML already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html static/index.html
          git commit -m "Keep storage recovery injection in production preparation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
