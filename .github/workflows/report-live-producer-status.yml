name: Report Live Producer Status

on:
  workflow_run:
    workflows:
      - "Refresh Live Data v10 PR3"
    types: [completed]

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Publish producer receipt
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { classifyProducerExecution } = require(`${process.env.GITHUB_WORKSPACE}/scripts/live-producer-execution.js`);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const evidence = classifyProducerExecution(run, jobs);
            for (const statusContext of ['producer/stockcheck-core', 'production/data-producer']) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: run.head_sha,
                state: evidence.state,
                context: statusContext,
                description: evidence.description.slice(0, 140),
                target_url: run.html_url,
              });
            }
            core.info(`${evidence.kind}: ${evidence.description} (${run.html_url})`);
