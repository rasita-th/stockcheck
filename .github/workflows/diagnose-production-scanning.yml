name: Diagnose Production Scanning

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-production-scanning.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check 'selenium>=4,<5'
      - name: Open production and verify Scanner recovery
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException

          base = 'https://rasita-th.github.io/stockcheck'
          with urllib.request.urlopen(f'{base}/build.json?diagnostic={int(time.time())}', timeout=30) as response:
              build = json.loads(response.read())
          print('BUILD_JSON', json.dumps(build, ensure_ascii=False))

          options = webdriver.ChromeOptions()
          options.page_load_strategy = 'eager'
          for flag in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000'):
              options.add_argument(flag)
          options.set_capability('goog:loggingPrefs', {'browser':'ALL','performance':'ALL'})
          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(35)
          try:
              try:
                  driver.get(f'{base}/index.html?production_verify={int(time.time())}')
              except TimeoutException:
                  driver.execute_script('window.stop()')

              states = []
              previous = 0
              for elapsed in (2, 5, 10, 20):
                  time.sleep(elapsed - previous)
                  previous = elapsed
                  state = driver.execute_script('''
                    const runtime = window.StockcheckTechnicalV2;
                    const snapshot = runtime?.getSnapshot?.();
                    const resources = performance.getEntriesByType('resource');
                    return {
                      elapsed: arguments[0],
                      buttons: [...document.querySelectorAll('#scanNowDesktop,#mobileScanNow')].map(b => ({id:b.id,text:b.textContent,disabled:b.disabled})),
                      subtitle: document.querySelector('#scannerSubtitle')?.textContent || '',
                      domRows: document.querySelectorAll('#technicalTableBody tr').length,
                      runtimeVersion: runtime?.version || null,
                      snapshotSchema: runtime?.snapshotSchema || null,
                      canonicalActive: Boolean(runtime?.isActive?.() && snapshot),
                      canonicalRows: Array.isArray(snapshot?.rows) ? snapshot.rows.length : 0,
                      snapshotRequests: resources.filter(r => r.name.includes('/data/screener_snapshot.json')).length,
                      technicalIndexRequests: resources.filter(r => r.name.includes('/data/technical/index.json')).length,
                      fundamentalRequests: resources.filter(r => r.name.includes('/data/fundamental.json')).length,
                    };
                  ''', elapsed)
                  states.append(state)
                  print('STATE', json.dumps(state, ensure_ascii=False))

              browser_logs = driver.get_log('browser')
              relevant_errors = [entry for entry in browser_logs if 'Invalid canonical screener snapshot contract' in entry.get('message','') or 'canonical snapshot did not become active' in entry.get('message','')]
              print('RELEVANT_ERRORS', json.dumps(relevant_errors, ensure_ascii=False))
              final = states[-1]
              assert build.get('source_commit') == '0c7d11f7630a7e05e8fbb367fa77b29f80fe5670', build
              assert final['runtimeVersion'] == '10.7.7', final
              assert final['snapshotSchema'] == '1.1', final
              assert final['canonicalActive'] is True, final
              assert final['canonicalRows'] == 407, final
              assert all(not button['disabled'] and button['text'] != 'Scanning…' for button in final['buttons']), final
              assert final['snapshotRequests'] <= 2, final
              assert final['technicalIndexRequests'] == 0, final
              assert not relevant_errors, relevant_errors
              print('PRODUCTION_VERIFIED', json.dumps(final, ensure_ascii=False))
              driver.save_screenshot('/tmp/production-scanning-diagnostic.png')
          finally:
              driver.quit()
          PY
      - name: Upload production screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-scanning-diagnostic
          path: /tmp/production-scanning-diagnostic.png
          if-no-files-found: ignore
