name: Apply Production Recovery

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/production-load-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install storage bootstrap recovery
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          guard = '''/* Stockcheck v10.8.4 storage compatibility and persisted-state recovery guard. */
          (() => {
            "use strict";

            const memory = new Map();
            const fallback = {
              getItem(key) {
                const normalized = String(key);
                return memory.has(normalized) ? memory.get(normalized) : null;
              },
              setItem(key, value) {
                memory.set(String(key), String(value));
              },
              removeItem(key) {
                memory.delete(String(key));
              },
              clear() {
                memory.clear();
              },
              key(index) {
                return Array.from(memory.keys())[Number(index)] ?? null;
              },
              get length() {
                return memory.size;
              },
            };

            try {
              const storage = window.localStorage;
              const probe = "__stockcheck_storage_probe__";
              storage.setItem(probe, "1");
              storage.removeItem(probe);
              window.__stockcheckStorageMode = "native";
            } catch (error) {
              Object.defineProperty(window, "localStorage", {
                configurable: true,
                enumerable: true,
                value: fallback,
              });
              window.__stockcheckStorageMode = "memory";
              console.warn(
                "Persistent browser storage is unavailable; using in-memory session storage.",
                error,
              );
            }

            function sanitizeJsonArrayKey(key) {
              try {
                const raw = window.localStorage.getItem(key);
                if (raw === null) return;
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) throw new TypeError("Expected a JSON array");
              } catch (error) {
                try {
                  window.localStorage.removeItem(key);
                } catch (_) {}
                console.warn(`Recovered invalid persisted state for ${key}.`, error);
              }
            }

            sanitizeJsonArrayKey("stockTimingRadar.alertDismissed.v62");
            window.__stockcheckStorageRecoveryVersion = "10.8.4";
          })();
          '''.replace("          ", "")

          for relative in ("site/storage-guard-v10-8-4.js", "static/storage-guard-v10-8-4.js"):
              Path(relative).write_text(guard, encoding="utf-8")

          prepare = Path("scripts/prepare_stable_site_v9_4_1.py")
          text = prepare.read_text(encoding="utf-8")
          old = 'STORAGE_GUARD_ASSET = "storage-guard-v10-7-3.js"'
          new = 'STORAGE_GUARD_ASSET = "storage-guard-v10-8-4.js"'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit("storage guard asset contract not found")
          prepare.write_text(text, encoding="utf-8")

          guard_tag = '  <script src="storage-guard-v10-8-4.js?v=10.8.4"></script>\n'
          for relative in ("site/index.html", "static/index.html"):
              path = Path(relative)
              html = path.read_text(encoding="utf-8")
              if "storage-guard-v10-8-4.js" not in html:
                  marker = '  <script src="app.js?v=10.7.1"></script>'
                  if marker not in html:
                      marker = '  <script src="app.js?v=10.8.3"></script>'
                  if marker not in html:
                      raise SystemExit(f"app.js marker missing in {relative}")
                  html = html.replace(marker, guard_tag + marker, 1)
                  path.write_text(html, encoding="utf-8")

          manifest_path = Path("config/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.setdefault("assets", {})["storage_guard_js"] = "10.8.4"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate isolated recovery patch
        run: |
          set -euo pipefail
          cmp site/storage-guard-v10-8-4.js static/storage-guard-v10-8-4.js
          node --check site/storage-guard-v10-8-4.js
          grep -F 'STORAGE_GUARD_ASSET = "storage-guard-v10-8-4.js"' scripts/prepare_stable_site_v9_4_1.py
          grep -F 'storage-guard-v10-8-4.js?v=10.8.4' site/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('config/release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['assets']['storage_guard_js'] == '10.8.4'
          PY

      - name: Commit recovery patch once
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Recovery patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/storage-guard-v10-8-4.js static/storage-guard-v10-8-4.js site/index.html static/index.html scripts/prepare_stable_site_v9_4_1.py config/release-manifest.json
          git commit -m "Fix malformed persisted alert state during bootstrap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
