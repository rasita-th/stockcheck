name: Verify Finnhub Today Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-finnhub-today
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify deployed Finnhub calendar and Today linkage
        run: |
          python -m py_compile scripts/verify_finnhub_today_deploy.py
          python scripts/verify_finnhub_today_deploy.py \
            --base-url https://rasita-th.github.io/stockcheck \
            --attempts 18 \
            --sleep-seconds 5
