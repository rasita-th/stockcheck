name: Apply Stock Detail Visual Link

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/stock-detail-readability-tuning' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add versioned readability stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          link = '  <link rel="stylesheet" href="stock-detail-visual-v10-8-5.css?v=10.8.5">\n'
          anchor = '  <link rel="stylesheet" href="memo-only-fix.css?v=9.5.4">\n'
          for relative in ('site/index.html', 'static/index.html'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if link in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'{relative}: stylesheet anchor missing')
              path.write_text(text.replace(anchor, anchor + link, 1), encoding='utf-8')
          PY

      - name: Verify source link and mirrored stylesheet
        run: |
          grep -F 'stock-detail-visual-v10-8-5.css?v=10.8.5' site/index.html
          grep -F 'stock-detail-visual-v10-8-5.css?v=10.8.5' static/index.html
          test -s site/stock-detail-visual-v10-8-5.css
          test -s static/stock-detail-visual-v10-8-5.css

      - name: Commit source link once
        run: |
          if git diff --quiet; then
            echo "Stock Detail visual link already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html static/index.html
          git commit -m "Load Stock Detail readability tuning"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
