name: Refresh Live Data v10 PR3

on:
  workflow_dispatch:
    inputs:
      full_technical:
        description: "Refresh full technical history and shards before publishing"
        required: false
        default: false
        type: boolean
  push:
    branches: ["main"]
    paths:
      - ".github/refresh-now"
  schedule:
    - cron: "*/15 * * * 1-5"
    - cron: "35 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: live-data-producer-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve fast and full refresh modes
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          FULL_TECHNICAL_INPUT: ${{ inputs.full_technical || 'false' }}
          TECHNICAL_DATA_PATH: site/data/technical.json
        run: |
          python scripts/resolve_live_refresh_mode.py >> "$GITHUB_OUTPUT"

      - name: Explain no-op outside refresh window
        if: steps.window.outputs.run_refresh != 'true'
        run: echo "Outside the core market refresh window at ${{ steps.window.outputs.now }}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install market-data dependencies
        if: steps.window.outputs.run_refresh == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed canonical generated layer
        if: steps.window.outputs.run_refresh == 'true'
        run: python scripts/build_generated_layer.py

      - name: Refresh latest quotes in bounded batches
        if: steps.window.outputs.run_refresh == 'true'
        env:
          QUOTE_REFRESH_WORKERS: "16"
          QUOTE_BATCH_SIZE: "80"
          QUOTE_REQUEST_TIMEOUT: "8"
          QUOTE_MIN_COVERAGE: "0.80"
        run: timeout --signal=TERM 10m python scripts/update_quote_data.py

      - name: Refresh full technical indicators and ticker shards
        if: steps.window.outputs.run_refresh == 'true' && steps.window.outputs.full_technical == 'true'
        env:
          INCLUDE_FUNDAMENTALS: "0"
          TECHNICAL_RANGE: "1y"
          TECHNICAL_INTERVAL: "1d"
          TECHNICAL_SCAN_WORKERS: "8"
        run: |
          python scripts/update_technical_data.py
          cp site/data/technical.json data/generated/technical.json
          cp site/data/scanner.json data/generated/scanner.json

      - name: Enforce fresh full-technical output
        if: steps.window.outputs.run_refresh == 'true' && steps.window.outputs.full_technical == 'true'
        run: |
          python scripts/check_data_freshness.py site/data/technical.json \
            --timestamp-field generatedAtTechnical \
            --timestamp-field generatedAt \
            --max-age-minutes 30 \
            --min-rows 1

      - name: Test market-hours technical refresh policy
        if: steps.window.outputs.run_refresh == 'true'
        run: python -m unittest tests.test_live_refresh_mode tests.test_data_freshness -v

      - name: Validate technical baseline market date
        if: steps.window.outputs.run_refresh == 'true'
        run: |
          python scripts/check_source_market_freshness.py site/data/technical.json \
            --report data/generated/source_freshness.json \
            --max-business-day-lag 1 \
            --min-coverage 0.80 \
            --max-stale-ratio 0.01

      - name: Build canonical intraday screener snapshot
        if: steps.window.outputs.run_refresh == 'true'
        run: |
          python scripts/build_screener_snapshot.py
          python scripts/enrich_drawdown_snapshot.py

      - name: Run core screener contracts
        if: steps.window.outputs.run_refresh == 'true'
        run: |
          python -m unittest tests.test_screener_snapshot -v
          python -m unittest tests.test_drawdown_snapshot -v
          python -m unittest tests.test_technical_shards -v
          python -m unittest tests.test_source_market_freshness -v
          node --check site/drawdown-screener-v10-9.js
          cmp site/drawdown-screener-v10-9.js static/drawdown-screener-v10-9.js
          cmp site/drawdown-screener-v10-9.css static/drawdown-screener-v10-9.css
          node tests/technical_shards_runtime.test.js
          node tests/drawdown_screener_runtime.test.js
          python scripts/verify_drawdown_snapshot.py \
            --snapshot site/data/screener_snapshot.json \
            --technical site/data/technical.json \
            --compat-output /tmp/screener_snapshot_v1_compat.json
          expected_runtime="$(python -c 'import json; print(json.load(open("config/release-manifest.json", encoding="utf-8"))["assets"]["technical_shards_js"])')"
          python scripts/verify_screener_snapshot.py \
            --snapshot /tmp/screener_snapshot_v1_compat.json \
            --quotes site/data/quote_latest.json \
            --technical site/data/technical.json \
            --runtime site/technical-shards-v2.js \
            --expected-snapshot-schema 1.0 \
            --expected-runtime "$expected_runtime" \
            --shard site/data/technical/symbols/AMD.json \
            --shard site/data/technical/symbols/ZETA.json \
            --shard site/data/technical/symbols/NVDA.json \
            --shard site/data/technical/symbols/CIFR.json

      - name: Build immutable core-data artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-artifact
          if [ "${{ steps.window.outputs.run_refresh }}" = "true" ]; then
            git add -N -- data/generated/technical site/data/technical static/data/technical
            git diff --binary HEAD -- \
              data/generated \
              site/data \
              static/data \
              ':(exclude)data/generated/fundamental.json' \
              ':(exclude)site/data/fundamental.json' \
              ':(exclude)static/data/fundamental.json' \
              ':(exclude)data/generated/market_pulse.json' \
              ':(exclude)site/data/market_pulse.json' \
              ':(exclude)static/data/market_pulse.json' \
              > publish-artifact/production-data.patch
          else
            : > publish-artifact/production-data.patch
          fi
          python scripts/validate_production_artifact.py create-metadata \
            --patch publish-artifact/production-data.patch \
            --metadata publish-artifact/metadata.json

      - name: Upload immutable core-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7
