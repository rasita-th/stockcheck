name: Refresh Live Data v10 PR3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/refresh-now"
  schedule:
    - cron: "*/15 * * * 1-5"
    - cron: "17 */2 * * 0,6"

permissions:
  contents: read

concurrency:
  group: live-data-producer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check refresh windows
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          weekday = now.weekday() < 5
          market_open = weekday and time(9, 25) <= now.time() <= time(16, 20)
          event_open = (weekday and time(6, 0) <= now.time() <= time(21, 0)) or not weekday
          print(f"market_open={'true' if market_open else 'false'}")
          print(f"event_open={'true' if event_open else 'false'}")
          print(f"now={now.isoformat()}")
          PY

      - name: Skip outside event window
        if: steps.window.outputs.event_open != 'true' && github.event_name != 'workflow_dispatch' && github.event_name != 'push'
        run: echo "Outside event window at ${{ steps.window.outputs.now }}"

      - uses: actions/checkout@v4
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed canonical generated layer
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: python scripts/build_generated_layer.py

      - name: Refresh latest quotes
        if: steps.window.outputs.market_open == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/update_quote_data.py

      - name: Refresh technical layer
        if: steps.window.outputs.market_open == 'true' || github.event_name == 'workflow_dispatch'
        env:
          INCLUDE_FUNDAMENTALS: "0"
          TECHNICAL_RANGE: "1y"
          TECHNICAL_INTERVAL: "1d"
          TECHNICAL_SCAN_WORKERS: "8"
        run: |
          python scripts/update_technical_data.py
          cp site/data/technical.json data/generated/technical.json
          cp site/data/scanner.json data/generated/scanner.json

      - name: Refresh PR3 personal Today desk
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          SEC_USER_AGENT: "Stock Timing Radar GitHub Action contact@users.noreply.github.com"
          ATTENTION_NEWS_USER_AGENT: "Stock Timing Radar GitHub Action contact@users.noreply.github.com"
          ATTENTION_NEWS_ENABLED: "1"
          ATTENTION_REGULATORS_ENABLED: "1"
          ATTENTION_NEWS_BATCH_SIZE: "10"
          ATTENTION_MAX_ITEMS: "7"
          SEC_BOOTSTRAP_DAYS: "1"
        run: python scripts/generate_attention_pr3.py

      - name: Run attention unit tests
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          python -m unittest discover -s tests -p "test_attention_p0.py" -v
          python -m unittest discover -s tests -p "test_attention_news.py" -v
          python -m unittest discover -s tests -p "test_attention_pr3.py" -v

      - name: Generate, publish and validate data mirrors
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          python scripts/test_publish_generated_data.py
          python scripts/generate_health.py
          python scripts/publish_generated_data.py
          python scripts/validate_generated_data_v9_1.py
          python scripts/validate_attention_pr2.py
          python scripts/validate_attention_pr3.py
          python scripts/validate_static_data.py
          python scripts/check_ui_view_contract.py

      - name: Build immutable live-data patch
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p publish-artifact
          git diff --binary HEAD -- \
            data/generated \
            data/source_state \
            site/data \
            static/data \
            ':(exclude)data/generated/market_pulse.json' \
            ':(exclude)site/data/market_pulse.json' \
            ':(exclude)static/data/market_pulse.json' \
            > publish-artifact/production-data.patch
          python scripts/validate_production_artifact.py create-metadata \
            --patch publish-artifact/production-data.patch \
            --metadata publish-artifact/metadata.json

      - name: Upload immutable live-data artifact
        if: steps.window.outputs.event_open == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7
