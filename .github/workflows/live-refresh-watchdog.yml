name: Maintain Live Data Freshness

on:
  workflow_run:
    workflows: ["Refresh Live Data v10 PR3"]
    types: [completed]
  schedule:
    # Recovery seed only. The completion chain is the primary cadence owner.
    - cron: "13,33,53 * * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: live-refresh-watchdog-main
  # A newer producer completion has a newer canonical scheduling decision.
  cancel-in-progress: true

jobs:
  maintain:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout policy from latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch one bounded refresh when due
        uses: actions/github-script@v7
        env:
          PRODUCER_COMPLETED_AT: ${{ github.event.workflow_run.updated_at || '' }}
        with:
          script: |
            const {
              extractQuoteTimestamp,
              resolveWatchdogDecision,
            } = require("${{ github.workspace }}/scripts/live-refresh-watchdog.js");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = "refresh-live-v9-1.yml";
            const deadline = Date.now() + 26 * 60 * 1000;
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            async function producerIsActive() {
              for (const status of ["queued", "in_progress"]) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: "main",
                  status,
                  per_page: 5,
                });
                if (response.data.workflow_runs.length > 0) return true;
              }
              return false;
            }

            async function readCanonicalQuoteTimestamp() {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: "data/generated/quote_latest.json",
                ref: "main",
              });
              if (Array.isArray(response.data) || response.data.type !== "file") return null;
              const payload = JSON.parse(Buffer.from(response.data.content, "base64").toString("utf8"));
              return extractQuoteTimestamp(payload);
            }

            while (Date.now() < deadline) {
              const activeProducer = await producerIsActive();
              let quoteTimestamp = null;
              try {
                quoteTimestamp = await readCanonicalQuoteTimestamp();
              } catch (error) {
                core.warning(`Unable to read canonical quote timestamp: ${error.message}`);
              }
              const decision = resolveWatchdogDecision({
                now: new Date(),
                quoteTimestamp,
                activeProducer,
                producerCompletedAt: process.env.PRODUCER_COMPLETED_AT || null,
              });
              core.info(`Watchdog decision: ${JSON.stringify(decision)}`);

              if (decision.action === "stop") return;
              if (decision.action === "dispatch") {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  ref: "main",
                  inputs: { full_technical: "false" },
                });
                core.notice(`Dispatched ${workflowId}: ${decision.reason}`);
                return;
              }

              const remainingSeconds = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
              const waitSeconds = Math.min(decision.waitSeconds, 120, remainingSeconds);
              if (waitSeconds < 1) break;
              await sleep(waitSeconds * 1000);
            }
            core.setFailed("Watchdog deadline reached during market hours without a safe refresh dispatch");
