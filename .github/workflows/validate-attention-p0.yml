name: Validate Today Attention PR4

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-live-v9-1.yml"
      - ".github/workflows/validate-attention-p0.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/deploy-pages-after-pr3.yml"
      - ".github/workflows/verify-production-screener.yml"
      - "scripts/update_technical_data.py"
      - "scripts/technical_shards.py"
      - "scripts/build_screener_snapshot.py"
      - "scripts/verify_screener_snapshot.py"
      - "scripts/generate_earnings_radar.py"
      - "scripts/generate_attention_p0.py"
      - "scripts/generate_attention_pr2.py"
      - "scripts/generate_attention_pr3.py"
      - "scripts/attention_pr3.py"
      - "scripts/attention_sources/**"
      - "scripts/sync_attention_assets.py"
      - "scripts/apply_runtime_asset_versions.py"
      - "scripts/build_generated_layer.py"
      - "scripts/generate_health.py"
      - "scripts/validate_generated_data_v9_1.py"
      - "scripts/validate_attention_pr2.py"
      - "scripts/validate_attention_pr3.py"
      - "scripts/validate_static_data.py"
      - "scripts/smoke_test_site_v9_4_6.py"
      - "scripts/prepare_stable_site_v9_4_1.py"
      - "scripts/check_ui_view_contract.py"
      - "scripts/preflight.sh"
      - "tests/test_technical_shards.py"
      - "tests/test_screener_snapshot.py"
      - "tests/technical_shards_runtime.test.js"
      - "tests/test_attention_p0.py"
      - "tests/test_attention_news.py"
      - "tests/test_attention_ir_registry.py"
      - "tests/test_attention_pr3.py"
      - "tests/test_attention_pr4_reliability.py"
      - "tests/fixtures/attention_news/**"
      - "tests/golden/attention_today_v2_0.json"
      - "data/portfolio.json"
      - "data/earnings_calendar.json"
      - "data/source_registry.json"
      - "data/sec_registry.json"
      - "data/regulator_sources.json"
      - "data/attention_preferences.json"
      - "data/source_state/news.json"
      - "site/technical-shards-v2.js"
      - "static/technical-shards-v2.js"
      - "site/storage-guard-*.js"
      - "site/attention-p0.*"
      - "site/attention-pr3.*"
      - "site/attention-pr4.*"
      - "static/attention-p0.*"
      - "static/attention-pr3.*"
      - "static/attention-pr4.*"
      - "site/today-view-isolation.css"
      - "static/today-view-isolation.css"
      - "site/memo-only-fix.*"
      - "static/memo-only-fix.*"
      - "site/data/attention_today.json"
      - "site/data/earnings_calendar.json"
      - "static/data/attention_today.json"
      - "static/data/earnings_calendar.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile attention, screener, technical and Pages scripts
        run: |
          python -m py_compile scripts/update_technical_data.py
          python -m py_compile scripts/technical_shards.py
          python -m py_compile scripts/build_screener_snapshot.py
          python -m py_compile scripts/verify_screener_snapshot.py
          python -m py_compile scripts/generate_earnings_radar.py
          python -m py_compile scripts/generate_attention_p0.py
          python -m py_compile scripts/generate_attention_pr2.py
          python -m py_compile scripts/generate_attention_pr3.py
          python -m py_compile scripts/attention_pr3.py
          python -m py_compile scripts/attention_sources/*.py
          python -m py_compile scripts/sync_attention_assets.py
          python -m py_compile scripts/apply_runtime_asset_versions.py
          python -m py_compile scripts/generate_health.py
          python -m py_compile scripts/validate_generated_data_v9_1.py
          python -m py_compile scripts/validate_attention_pr2.py
          python -m py_compile scripts/validate_attention_pr3.py
          python -m py_compile scripts/validate_static_data.py
          python -m py_compile scripts/smoke_test_site_v9_4_6.py
          python -m py_compile scripts/prepare_stable_site_v9_4_1.py
          node --check site/technical-shards-v2.js
          node --check static/technical-shards-v2.js
          node --check tests/technical_shards_runtime.test.js
          node --check site/storage-guard-v10-7-3.js
      - name: Run attention screener and technical unit tests
        run: |
          python -m unittest discover -s tests -p "test_attention_p0.py" -v
          python -m unittest discover -s tests -p "test_attention_news.py" -v
          python -m unittest discover -s tests -p "test_attention_ir_registry.py" -v
          python -m unittest discover -s tests -p "test_attention_pr3.py" -v
          python -m unittest discover -s tests -p "test_attention_pr4_reliability.py" -v
          python -m unittest tests.test_technical_shards -v
          python -m unittest tests.test_screener_snapshot -v
          node tests/technical_shards_runtime.test.js
          node tests/drawdown_screener_runtime.test.js
      - name: Build deterministic market-wide fixtures
        env:
          EARNINGS_RADAR_DAYS_BACK: "1"
          EARNINGS_RADAR_DAYS_FORWARD: "14"
          STOCKCHECK_ATTENTION_OFFLINE: "1"
          ATTENTION_NEWS_ENABLED: "0"
          ATTENTION_REGULATORS_ENABLED: "0"
          ATTENTION_MAX_ITEMS: "7"
        run: |
          python scripts/finnhub_sharded_state.py hydrate
          python scripts/generate_earnings_radar.py
          rm -f data/finnhub/state.json
          python scripts/generate_attention_pr3.py
      - name: Sync Today runtime assets
        run: python scripts/sync_attention_assets.py
      - name: Validate generated schema and UI isolation
        run: |
          python scripts/build_generated_layer.py
          python scripts/generate_health.py
          python scripts/publish_generated_data.py
          python scripts/validate_generated_data_v9_1.py
          python scripts/validate_attention_pr2.py
          python scripts/validate_attention_pr3.py
          python scripts/check_ui_view_contract.py
      - name: Run the production Pages preflight
        run: |
          python scripts/prepare_stable_site_v9_4_1.py
          python scripts/apply_runtime_asset_versions.py
          node --check site/app.js
          node --check site/technical-shards-v2.js
          node tests/technical_shards_runtime.test.js
          node tests/drawdown_screener_runtime.test.js
          node --check site/storage-guard-v10-7-3.js
          node --check site/app-shell-v9-4-6.js
          node --check site/attention-p0.js
          node --check site/attention-pr3.js
          node --check site/attention-pr4.js
          node --check site/memo-only-fix.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path("scripts/prepare_stable_site_v9_4_1.py").read_text(encoding="utf-8")
          index = Path("site/index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("config/release-manifest.json").read_text(encoding="utf-8"))
          runtime_match = re.search(r'^VERSION = "([^"]+)"$', source, flags=re.MULTILINE)
          technical_match = re.search(r'^TECHNICAL_RUNTIME_VERSION = "([^"]+)"$', source, flags=re.MULTILINE)
          guard_match = re.search(r'^STORAGE_GUARD_ASSET = "([^"]+)"$', source, flags=re.MULTILINE)
          if not runtime_match or not technical_match or not guard_match:
              raise SystemExit("runtime version declarations are missing")
          runtime_version = runtime_match.group(1)
          technical_version = technical_match.group(1)
          guard_asset = guard_match.group(1)
          shell_js_version = str(manifest.get("assets", {}).get("app_shell_js") or runtime_version)
          shell_css_version = str(manifest.get("assets", {}).get("app_shell_css") or shell_js_version)
          required = (
              f"app.js?v={runtime_version}",
              f"technical-shards-v2.js?v={technical_version}",
              f"{guard_asset}?v={runtime_version}",
              f"app-shell-v9-4-6.js?v={shell_js_version}",
              f"app-shell-v9-4-6.css?v={shell_css_version}",
          )
          missing = [token for token in required if token not in index]
          if missing:
              raise SystemExit(f"prepared Pages runtime references are missing: {missing}")
          if index.find(f"{guard_asset}?v={runtime_version}") > index.find(f"app.js?v={runtime_version}"):
              raise SystemExit("storage guard does not precede app.js")
          print(
              f"Pages runtime preflight passed: app={runtime_version}, technical={technical_version}, "
              f"shell-js={shell_js_version}, shell-css={shell_css_version}"
          )
          PY
          test -s site/today-view-isolation.css
          test -s site/attention-pr3.css
          test -s site/attention-pr4.css
          python scripts/validate_static_data.py
          python scripts/smoke_test_site_v9_4_6.py
          python scripts/check_ui_view_contract.py

  rehearse-live-event-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install live-refresh dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed canonical generated layer
        run: python scripts/build_generated_layer.py
      - name: Generate Today data without quote or technical refresh
        env:
          SEC_USER_AGENT: "Stock Timing Radar GitHub Action contact@users.noreply.github.com"
          ATTENTION_NEWS_USER_AGENT: "Stock Timing Radar GitHub Action contact@users.noreply.github.com"
          ATTENTION_NEWS_ENABLED: "1"
          ATTENTION_REGULATORS_ENABLED: "1"
          ATTENTION_NEWS_BATCH_SIZE: "10"
          ATTENTION_MAX_ITEMS: "7"
          SEC_BOOTSTRAP_DAYS: "1"
        run: python scripts/generate_attention_pr3.py
      - name: Verify live company IR coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/generated/attention_today.json").read_text(encoding="utf-8"))
          ir = payload.get("health", {}).get("ir", {})
          registry = ir.get("registry", {})
          if registry.get("missing") != 0 or registry.get("configured") != 35:
              raise SystemExit(f"IR registry coverage is incomplete: {registry}")
          if int(ir.get("ok") or 0) < 1:
              raise SystemExit(f"No configured company IR source succeeded in the live batch: {ir}")
          print(f"Verified live IR coverage: ok={ir['ok']}/{ir['checked']}; registry={registry}")
          PY
      - name: Test generated-data publication
        run: python scripts/test_publish_generated_data.py
      - name: Generate data health
        run: python scripts/generate_health.py
      - name: Publish generated mirrors
        run: python scripts/publish_generated_data.py
      - name: Validate generated-data contract
        run: python scripts/validate_generated_data_v9_1.py
      - name: Validate legacy PR2 compatibility
        run: python scripts/validate_attention_pr2.py
      - name: Validate current PR3 contract
        run: python scripts/validate_attention_pr3.py
      - name: Validate static data
        run: python scripts/validate_static_data.py
