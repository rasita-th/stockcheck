name: Publish Production Data

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: "Completed live producer run carrying the immutable artifact"
        required: true
        type: string
  workflow_run:
    workflows:
      - "Refresh Finnhub Earnings Events"
      - "Refresh Finnhub Analyst Features"
      - "Refresh Finnhub Full Backfill"
      - "Refresh Market Pulse v9.6"
      - "Update static fundamental data"
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: production-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve and verify immutable producer receipt
        id: source
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.producer_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.REQUESTED_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId < 1) {
              core.setFailed(`Invalid producer run id: ${process.env.REQUESTED_RUN_ID}`);
              return;
            }
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            let run = null;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              run = response.data;
              if (run.status === "completed") break;
              await sleep(2000);
            }
            if (!run || run.status !== "completed" || run.conclusion !== "success") {
              core.setFailed(`Producer run ${runId} did not complete successfully`);
              return;
            }
            if (run.head_branch !== "main") {
              core.setFailed(`Producer run ${runId} is not bound to main`);
              return;
            }
            if (context.eventName === "workflow_dispatch" && run.name !== "Refresh Live Data v10 PR3") {
              core.setFailed(`Manual receipt dispatch only accepts the live producer, got ${run.name}`);
              return;
            }
            for (const [key, value] of Object.entries({
              name: run.name,
              run_id: run.id,
              run_attempt: run.run_attempt,
              head_sha: run.head_sha,
              head_branch: run.head_branch,
              event: run.event,
            })) core.setOutput(key, String(value));

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download immutable producer artifact
        uses: actions/download-artifact@v4
        with:
          name: production-data-${{ steps.source.outputs.run_id }}
          path: /tmp/production-data
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source, hash, paths and replay state
        id: contract
        run: |
          set -euo pipefail
          python scripts/validate_production_artifact.py validate \
            --patch /tmp/production-data/production-data.patch \
            --metadata /tmp/production-data/metadata.json \
            --ledger data/publisher-state.json \
            --repository "${{ github.repository }}" \
            --workflow-name "${{ steps.source.outputs.name }}" \
            --run-id "${{ steps.source.outputs.run_id }}" \
            --run-attempt "${{ steps.source.outputs.run_attempt }}" \
            --source-sha "${{ steps.source.outputs.head_sha }}" \
            --branch "${{ steps.source.outputs.head_branch }}" \
            --event "${{ steps.source.outputs.event }}"

      - name: Apply production patch atomically
        id: apply
        if: steps.contract.outputs.status == 'READY'
        run: |
          set -euo pipefail
          patch=/tmp/production-data/production-data.patch
          git apply --check --3way "$patch"
          git apply --index --3way "$patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Synchronize Attention market fields from canonical live data
        if: steps.contract.outputs.status == 'READY' && steps.contract.outputs.producer == 'Refresh Live Data v10 PR3'
        run: |
          set -euo pipefail
          python scripts/sync_attention_market_fields.py
          git add \
            data/generated/attention_today.json \
            site/data/attention_today.json \
            static/data/attention_today.json

      - name: Enforce generated-file size budgets
        if: steps.contract.outputs.status == 'READY'
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --cached --name-only --diff-filter=ACMR)
          if [ "${#changed_paths[@]}" -gt 0 ]; then
            python scripts/check_generated_file_sizes.py "${changed_paths[@]}"
          fi

      - name: Validate merged production tree
        if: steps.contract.outputs.status == 'READY'
        run: |
          set -euo pipefail
          producer="${{ steps.contract.outputs.producer }}"
          if [ "$producer" = "Refresh Live Data v10 PR3" ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          roots = (Path('data/generated'), Path('site/data'), Path('static/data'))
          names = ('quote_latest.json', 'scanner.json', 'technical.json')
          payloads = {}
          for root in roots:
              for name in names:
                  path = root / name
                  if not path.exists():
                      raise SystemExit(f'missing live-data file after apply: {path}')
                  try:
                      payload = json.loads(path.read_text(encoding='utf-8'))
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f'invalid JSON in {path}: {exc}') from exc
                  if not isinstance(payload, dict):
                      raise SystemExit(f'{path}: root must be an object')
                  rows = payload.get('rows')
                  if not isinstance(rows, list) or not rows:
                      raise SystemExit(f'{path}: rows must be a non-empty list')
                  payloads[(str(root), name)] = payload

          for name in names:
              canonical = (Path('data/generated') / name).read_bytes()
              for mirror in (Path('site/data') / name, Path('static/data') / name):
                  if mirror.read_bytes() != canonical:
                      raise SystemExit(f'live-data mirror mismatch: {mirror} vs data/generated/{name}')

          quote = payloads[('data/generated', 'quote_latest.json')]
          technical = payloads[('data/generated', 'technical.json')]
          scanner = payloads[('data/generated', 'scanner.json')]
          quote_symbols = {str(row.get('ticker') or row.get('symbol') or '').upper() for row in quote['rows']}
          technical_symbols = {str(row.get('ticker') or row.get('symbol') or '').upper() for row in technical['rows']}
          scanner_symbols = {str(row.get('ticker') or row.get('symbol') or '').upper() for row in scanner['rows']}
          if len(quote_symbols) < 1 or len(technical_symbols) < 1 or len(scanner_symbols) < 1:
              raise SystemExit('live-data symbol sets are empty')
          if scanner_symbols != technical_symbols:
              raise SystemExit('scanner and technical symbol sets differ')
          coverage = len(quote_symbols & technical_symbols) / len(technical_symbols)
          if coverage < 0.80:
              raise SystemExit(f'live quote coverage below publisher minimum: {coverage:.1%}')
          print(f'Live-data domain validation passed: {len(technical_symbols)} technical rows, quote coverage={coverage:.1%}')
          PY
          else
            python scripts/validate_static_data.py
          fi
          python scripts/validate_generated_data_v9_1.py
          python scripts/validate_attention_pr3.py
          python scripts/validate_earnings_radar.py
          if [ "$producer" = "Refresh Market Pulse v9.6" ]; then
            python scripts/validate_market_pulse.py data/generated/market_pulse.json --min-ok-rate 0.75
            cmp data/generated/market_pulse.json data/market_pulse.json
            cmp data/generated/market_pulse.json site/data/market_pulse.json
            cmp data/generated/market_pulse.json static/data/market_pulse.json
          fi
          if [ "$producer" = "Refresh Finnhub Analyst Features" ] || [ "$producer" = "Refresh Finnhub Full Backfill" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          paths = (
              Path('data/generated/recommendation_trends.json'),
              Path('data/recommendation_trends.json'),
              Path('site/data/recommendation_trends.json'),
              Path('static/data/recommendation_trends.json'),
          )
          canonical = paths[0].read_bytes()
          if not canonical:
              raise SystemExit('canonical consensus projection is empty')
          payload = json.loads(canonical)
          if not isinstance(payload, dict):
              raise SystemExit('canonical consensus projection root must be an object')
          for mirror in paths[1:]:
              if mirror.read_bytes() != canonical:
                  raise SystemExit(f'consensus mirror mismatch: {mirror} vs {paths[0]}')
          print('Consensus canonical projection and mirrors are valid.')
          PY
          fi
          if [ "$producer" = "Update static fundamental data" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          paths = (
              Path('data/generated/fundamental.json'),
              Path('site/data/fundamental.json'),
              Path('static/data/fundamental.json'),
          )
          canonical = paths[0].read_bytes()
          payload = json.loads(canonical)
          if not isinstance(payload.get('rows'), list) or not payload['rows']:
              raise SystemExit('published fundamental rows are empty')
          for path in paths[1:]:
              if path.read_bytes() != canonical:
                  raise SystemExit(f'fundamental mirror mismatch: {path} vs {paths[0]}')
          print('Published Fundamental canonical projection and mirrors are valid.')
          PY
            python scripts/validate_fundamental_snapshot.py data/generated/fundamental.json \
              --mirror site/data/fundamental.json \
              --mirror static/data/fundamental.json
          fi

      - name: Regenerate health from merged production tree
        if: steps.contract.outputs.status == 'READY'
        run: |
          set -euo pipefail
          python scripts/generate_health.py
          cmp data/generated/health.json site/data/health.json
          cmp data/generated/health.json static/data/health.json
          git add data/generated/health.json site/data/health.json static/data/health.json

      - name: Record publisher ledger
        if: steps.contract.outputs.status == 'READY'
        run: |
          python scripts/validate_production_artifact.py record \
            --ledger data/publisher-state.json \
            --producer "${{ steps.contract.outputs.producer }}" \
            --run-id "${{ steps.contract.outputs.run_id }}" \
            --run-attempt "${{ steps.contract.outputs.run_attempt }}" \
            --produced-at "${{ steps.contract.outputs.produced_at }}" \
            --patch-sha256 "${{ steps.contract.outputs.patch_sha256 }}" \
            --source-sha "${{ steps.source.outputs.head_sha }}"
          git add data/publisher-state.json

      - name: Commit and push through the single writer
        if: steps.contract.outputs.status == 'READY'
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish production data from ${{ steps.source.outputs.name }}"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Unable to publish production data after three attempts."
          exit 1

      - name: Dispatch exact Pages deployment
        if: steps.push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.push.outputs.published_sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml \
            --ref main \
            -f expected_commit="$PUBLISHED_SHA"

      - name: Publish result summary
        if: always()
        env:
          STATUS: ${{ steps.contract.outputs.status || 'REJECTED_OR_FAILED' }}
          REASON: ${{ steps.contract.outputs.reason || 'artifact validation or publishing failed' }}
          PRODUCER: ${{ steps.contract.outputs.producer || steps.source.outputs.name }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          CHANGED_COUNT: ${{ steps.contract.outputs.changed_count || '0' }}
          PATCH_SHA: ${{ steps.contract.outputs.patch_sha256 || 'unavailable' }}
          PUBLISHED_SHA: ${{ steps.push.outputs.published_sha || 'none' }}
          PAGES_TRIGGER: ${{ steps.push.outputs.published == 'true' && 'exact workflow dispatch' || 'none' }}
        run: |
          {
            echo "## Production publisher result"
            echo
            echo "- Result: \`$STATUS\`"
            echo "- Reason: $REASON"
            echo "- Producer: $PRODUCER"
            echo "- Producer run: $RUN_ID / attempt $RUN_ATTEMPT"
            echo "- Changed paths: $CHANGED_COUNT"
            echo "- Patch SHA-256: \`$PATCH_SHA\`"
            echo "- Published commit: \`$PUBLISHED_SHA\`"
            echo "- Pages trigger: $PAGES_TRIGGER"
          } >> "$GITHUB_STEP_SUMMARY"
