name: Publish Production Data

on:
  workflow_run:
    workflows:
      - "Refresh Finnhub Earnings Events"
      - "Refresh Finnhub Analyst Features"
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: production-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download immutable producer artifact
        uses: actions/download-artifact@v4
        with:
          name: production-data-${{ github.event.workflow_run.id }}
          path: /tmp/production-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate producer metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('/tmp/production-data/metadata.json')
          metadata = json.loads(path.read_text(encoding='utf-8'))
          expected_id = str(os.environ['SOURCE_RUN_ID'])
          expected_sha = os.environ['SOURCE_SHA']
          if metadata.get('schema_version') != '1.0':
              raise SystemExit('Unsupported production artifact schema')
          if str(metadata.get('producer_run_id')) != expected_id:
              raise SystemExit('Producer run ID mismatch')
          if metadata.get('producer_sha') != expected_sha:
              raise SystemExit('Producer SHA mismatch')
          print(f"Verified artifact from {metadata.get('producer')} run {expected_id}")
          PY
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Apply production patch atomically
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          patch=/tmp/production-data/production-data.patch
          test -f "$patch"
          if [ ! -s "$patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Producer completed with no data changes."
            exit 0
          fi
          git apply --check --3way "$patch"
          git apply --index --3way "$patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate merged production tree
        if: steps.apply.outputs.changed == 'true'
        run: |
          python scripts/validate_static_data.py
          python scripts/validate_generated_data_v9_1.py
          python scripts/validate_attention_pr3.py
          python scripts/validate_earnings_radar.py

      - name: Commit and push through the single writer
        if: steps.apply.outputs.changed == 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish production data from ${{ github.event.workflow_run.name }}"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Unable to publish production data after three attempts."
          exit 1

      - name: Dispatch Pages after published data
        if: steps.push.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
            core.info('Dispatched deploy-pages.yml after the single publisher pushed main.');
