name: Publish Production Data

on:
  workflow_run:
    workflows:
      - "Refresh Finnhub Earnings Events"
      - "Refresh Finnhub Analyst Features"
      - "Refresh Finnhub Full Backfill"
      - "Refresh Live Data v10 PR3"
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: production-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download immutable producer artifact
        uses: actions/download-artifact@v4
        with:
          name: production-data-${{ github.event.workflow_run.id }}
          path: /tmp/production-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source, hash, paths and replay state
        id: contract
        run: |
          set -euo pipefail
          python scripts/validate_production_artifact.py validate \
            --patch /tmp/production-data/production-data.patch \
            --metadata /tmp/production-data/metadata.json \
            --ledger data/publisher-state.json \
            --repository "${{ github.repository }}" \
            --workflow-name "${{ github.event.workflow_run.name }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --source-sha "${{ github.event.workflow_run.head_sha }}" \
            --branch "${{ github.event.workflow_run.head_branch }}" \
            --event "${{ github.event.workflow_run.event }}"

      - name: Apply production patch atomically
        id: apply
        if: steps.contract.outputs.status == 'READY'
        run: |
          set -euo pipefail
          patch=/tmp/production-data/production-data.patch
          git apply --check --3way "$patch"
          git apply --index --3way "$patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate merged production tree
        if: steps.contract.outputs.status == 'READY'
        run: |
          python scripts/validate_static_data.py
          python scripts/validate_generated_data_v9_1.py
          python scripts/validate_attention_pr3.py
          python scripts/validate_earnings_radar.py

      - name: Record publisher ledger
        if: steps.contract.outputs.status == 'READY'
        run: |
          python scripts/validate_production_artifact.py record \
            --ledger data/publisher-state.json \
            --producer "${{ steps.contract.outputs.producer }}" \
            --run-id "${{ steps.contract.outputs.run_id }}" \
            --run-attempt "${{ steps.contract.outputs.run_attempt }}" \
            --produced-at "${{ steps.contract.outputs.produced_at }}" \
            --patch-sha256 "${{ steps.contract.outputs.patch_sha256 }}" \
            --source-sha "${{ github.event.workflow_run.head_sha }}"
          git add data/publisher-state.json

      - name: Commit and push through the single writer
        if: steps.contract.outputs.status == 'READY'
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish production data from ${{ github.event.workflow_run.name }}"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Unable to publish production data after three attempts."
          exit 1

      - name: Dispatch Pages after published data
        if: steps.push.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
            core.info('Dispatched deploy-pages.yml after the hardened publisher pushed main.');

      - name: Publish result summary
        if: always()
        env:
          STATUS: ${{ steps.contract.outputs.status || 'REJECTED_OR_FAILED' }}
          REASON: ${{ steps.contract.outputs.reason || 'artifact validation or publishing failed' }}
          PRODUCER: ${{ steps.contract.outputs.producer || github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CHANGED_COUNT: ${{ steps.contract.outputs.changed_count || '0' }}
          PATCH_SHA: ${{ steps.contract.outputs.patch_sha256 || 'unavailable' }}
          PUBLISHED_SHA: ${{ steps.push.outputs.published_sha || 'none' }}
          PAGES: ${{ steps.push.outputs.published == 'true' && 'yes' || 'no' }}
        run: |
          {
            echo "## Production publisher result"
            echo
            echo "- Result: \`$STATUS\`"
            echo "- Reason: $REASON"
            echo "- Producer: $PRODUCER"
            echo "- Producer run: $RUN_ID / attempt $RUN_ATTEMPT"
            echo "- Changed paths: $CHANGED_COUNT"
            echo "- Patch SHA-256: \`$PATCH_SHA\`"
            echo "- Published commit: \`$PUBLISHED_SHA\`"
            echo "- Pages dispatched: $PAGES"
          } >> "$GITHUB_STEP_SUMMARY"
