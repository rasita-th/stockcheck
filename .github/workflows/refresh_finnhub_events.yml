name: Refresh Finnhub Earnings Events

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/run_finnhub_free_tier.py"
      - "scripts/finnhub_pipeline.py"
      - "scripts/compact_finnhub_state.py"
      - "scripts/finnhub_sharded_state.py"
      - "scripts/check_generated_file_sizes.py"
      - "scripts/generate_earnings_radar.py"
      - "scripts/validate_earnings_radar.py"
      - "data/earnings_relevance.json"
      - ".github/workflows/refresh_finnhub_events.yml"
      - ".github/refresh-finnhub-now"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: finnhub-events-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed canonical generated layer
        run: python scripts/build_generated_layer.py
      - name: Hydrate ephemeral Finnhub working state
        run: python scripts/finnhub_sharded_state.py hydrate
      - name: Refresh free-tier Finnhub events with key A
        env:
          FINNHUB_API_KEY_EVENTS: ${{ secrets.FINNHUB_API_KEY_EVENTS || secrets.FINNHUB_API_KEY }}
          FINNHUB_EVENTS_MAX_CALLS_PER_RUN: "48"
          FINNHUB_CALENDAR_TTL_HOURS: "3"
          FINNHUB_MIN_DELAY_SECONDS: "1.25"
        run: python scripts/run_finnhub_free_tier.py --mode events
      - name: Compact Finnhub state and public projection
        run: python scripts/compact_finnhub_state.py --write
      - name: Publish sharded Finnhub state
        run: python scripts/finnhub_sharded_state.py shard --delete-legacy
      - name: Enforce Finnhub output size budgets
        run: |
          mapfile -t shard_files < <(find data/finnhub/state -type f -name '*.json' -print | sort)
          python scripts/check_generated_file_sizes.py \
            "${shard_files[@]}" \
            data/finnhub_features.json \
            site/data/finnhub_features.json \
            static/data/finnhub_features.json
      - name: Promote Finnhub contracts to canonical generated data
        run: |
          mkdir -p data/generated
          cp data/earnings_calendar.json data/generated/earnings_calendar.json
          cp data/eps_surprises.json data/generated/eps_surprises.json
          cp data/finnhub_features.json data/generated/finnhub_features.json
      - name: Generate market-wide earnings radar contract
        env:
          EARNINGS_RADAR_DAYS_BACK: "1"
          EARNINGS_RADAR_DAYS_FORWARD: "45"
        run: python scripts/generate_earnings_radar.py
      - name: Regenerate PR3 Today from refreshed earnings
        env:
          SEC_USER_AGENT: "Stock Timing Radar GitHub Action contact@users.noreply.github.com"
          ATTENTION_NEWS_USER_AGENT: "Stock Timing Radar GitHub Action contact@users.noreply.github.com"
          ATTENTION_NEWS_ENABLED: "1"
          ATTENTION_REGULATORS_ENABLED: "1"
          ATTENTION_NEWS_BATCH_SIZE: "10"
          ATTENTION_MAX_ITEMS: "7"
          SEC_BOOTSTRAP_DAYS: "1"
        run: python scripts/generate_attention_pr3.py
      - name: Test generated contracts
        run: |
          python -m py_compile scripts/run_finnhub_free_tier.py scripts/compact_finnhub_state.py scripts/finnhub_sharded_state.py scripts/check_generated_file_sizes.py scripts/generate_earnings_radar.py scripts/validate_earnings_radar.py scripts/validate_production_artifact.py
          python -m unittest tests.test_finnhub_pipeline tests.test_finnhub_free_tier tests.test_finnhub_compaction tests.test_finnhub_sharded_state tests.test_earnings_radar
          test ! -e data/finnhub/state.json
          test -f data/finnhub/state/index.json
          python -m unittest discover -s tests -p "test_attention_p0.py" -v
          python -m unittest discover -s tests -p "test_attention_pr3.py" -v
          python scripts/test_publish_generated_data.py
          python scripts/generate_health.py
          python scripts/publish_generated_data.py
          python scripts/validate_generated_data_v9_1.py
          python scripts/validate_attention_pr3.py
          python scripts/validate_earnings_radar.py
          python scripts/validate_static_data.py
          python scripts/sync_attention_assets.py
          python scripts/check_ui_view_contract.py
      - name: Build immutable production artifact
        run: |
          set -euo pipefail
          mkdir -p publish-artifact
          git diff --binary HEAD -- data/finnhub data/earnings_calendar.json data/eps_surprises.json data/finnhub_features.json data/generated data/source_state site/data static/data \
            ':(exclude)data/generated/market_pulse.json' ':(exclude)site/data/market_pulse.json' ':(exclude)static/data/market_pulse.json' \
            > publish-artifact/production-data.patch
          python scripts/check_generated_file_sizes.py publish-artifact/production-data.patch
          python scripts/validate_production_artifact.py create-metadata \
            --patch publish-artifact/production-data.patch \
            --metadata publish-artifact/metadata.json
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: publish-artifact
          if-no-files-found: error
          retention-days: 7
