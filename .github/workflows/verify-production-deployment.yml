name: Verify Production Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Deploy GitHub Pages run ID containing the verified receipt"
        required: true
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve deploy run
        id: deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified deployment receipt
        uses: actions/download-artifact@v4
        with:
          name: production-deploy-receipt-${{ steps.deploy.outputs.run_id }}
          path: /tmp/deploy-receipt
          run-id: ${{ steps.deploy.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release identity and production data linkage
        run: |
          python -m py_compile scripts/verify_production_deployment.py
          python scripts/verify_production_deployment.py \
            --manifest config/release-manifest.json \
            --receipt /tmp/deploy-receipt/deploy-receipt.json \
            --attempts 18 \
            --sleep-seconds 5
