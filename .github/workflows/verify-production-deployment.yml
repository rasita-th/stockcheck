name: Verify Production Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Deploy GitHub Pages run ID containing the verified receipt"
        required: true
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: verify-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve deploy run
        id: deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified deployment receipt
        uses: actions/download-artifact@v4
        with:
          name: production-deploy-receipt-${{ steps.deploy.outputs.run_id }}
          path: /tmp/deploy-receipt
          run-id: ${{ steps.deploy.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install production browser dependency
        run: python -m pip install --disable-pip-version-check "selenium>=4,<5"

      - name: Verify release identity production data and Drawdown browser flow
        run: |
          python -m py_compile \
            scripts/verify_production_deployment.py \
            scripts/verify_drawdown_production.py \
            scripts/verify_drawdown_browser.py
          python -m unittest tests.test_production_verifier tests.test_drawdown_production_verifier -v
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('config/release-manifest.json').read_text(encoding='utf-8'))
          print(str(manifest['production_base_url']).rstrip('/'))
          PY
          )"
          python scripts/verify_production_deployment.py \
            --manifest config/release-manifest.json \
            --receipt /tmp/deploy-receipt/deploy-receipt.json \
            --attempts 18 \
            --sleep-seconds 5
          python scripts/verify_drawdown_production.py \
            --base-url "$BASE_URL" \
            --attempts 18 \
            --sleep-seconds 5
          python scripts/verify_drawdown_browser.py --base-url "$BASE_URL"

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawdown-production-browser-failures-${{ github.run_id }}
          path: /tmp/drawdown-*-failure.png
          if-no-files-found: ignore

  report:
    if: always() && github.event_name == 'workflow_run'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Publish production browser smoke status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          state=failure
          description="Production Drawdown browser smoke failed"
          if [ "$RESULT" = "success" ]; then
            state=success
            description="Production Drawdown browser smoke passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="$state" \
            -f context="production/browser-smoke" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
