name: Verify Production Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Deploy GitHub Pages run ID containing the verified receipt"
        required: true
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: verify-production-deployment
  cancel-in-progress: false

jobs:
  identity:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_run_id: ${{ steps.deploy.outputs.run_id }}
      source_commit: ${{ steps.receipt.outputs.source_commit }}
      receipt_status: ${{ steps.receipt.outputs.receipt_status }}
    steps:
      - name: Resolve deploy run
        id: deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download immutable deployment receipt
        uses: actions/download-artifact@v4
        with:
          name: production-deploy-receipt-${{ steps.deploy.outputs.run_id }}
          path: /tmp/deploy-receipt
          run-id: ${{ steps.deploy.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment receipt identity
        id: receipt
        env:
          EXPECTED_RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(Path('/tmp/deploy-receipt/deploy-receipt.json').read_text(encoding='utf-8'))
          source_commit = str(receipt.get('source_commit') or '')
          if receipt.get('schema_version') != '1.1':
              raise SystemExit('unsupported deployment receipt schema')
          if str(receipt.get('deploy_run_id') or '') != os.environ['EXPECTED_RUN_ID']:
              raise SystemExit('deployment receipt run ID mismatch')
          if not re.fullmatch(r'[0-9a-f]{40}', source_commit):
              raise SystemExit('deployment receipt source commit is not an exact SHA')
          status = str(receipt.get('status') or '')
          if status not in {'verified', 'failed'}:
              raise SystemExit('deployment receipt status is invalid')
          if receipt.get('production_smoke_passed') is not (status == 'verified'):
              raise SystemExit('deployment receipt smoke result is inconsistent')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'source_commit={source_commit}\n')
              output.write(f'receipt_status={status}\n')
          print(json.dumps(receipt, ensure_ascii=False))
          PY

  verify:
    needs: identity
    if: needs.identity.outputs.receipt_status == 'verified'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download immutable deployment receipt
        uses: actions/download-artifact@v4
        with:
          name: production-deploy-receipt-${{ needs.identity.outputs.deploy_run_id }}
          path: /tmp/deploy-receipt
          run-id: ${{ needs.identity.outputs.deploy_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install production browser dependency
        run: python -m pip install --disable-pip-version-check "selenium>=4,<5"

      - name: Verify production identity Drawdown data and browser flow
        run: |
          python -m py_compile \
            scripts/verify_production_deployment.py \
            scripts/verify_drawdown_production.py \
            scripts/verify_drawdown_browser.py
          python -m unittest \
            tests.test_drawdown_production_verifier \
            tests.test_drawdown_browser_verifier \
            -v
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('config/release-manifest.json').read_text(encoding='utf-8'))
          print(str(manifest['production_base_url']).rstrip('/'))
          PY
          )"
          BASE_URL="$BASE_URL" python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          base = os.environ['BASE_URL'].rstrip('/')
          receipt = json.loads(Path('/tmp/deploy-receipt/deploy-receipt.json').read_text(encoding='utf-8'))
          expected = str(receipt.get('source_commit') or '')
          for attempt in range(1, 19):
              try:
                  request = urllib.request.Request(
                      f"{base}/build.json?identity={int(time.time())}-{attempt}",
                      headers={'Cache-Control': 'no-cache', 'User-Agent': 'stockcheck-production-identity/1.0'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      build = json.loads(response.read())
                  actual = str(build.get('source_commit') or '')
                  if actual != expected:
                      raise ValueError(f'production build identity mismatch: expected {expected}, got {actual}')
                  print(json.dumps({'status': 'verified', 'source_commit': actual}, ensure_ascii=False))
                  break
              except Exception as exc:
                  print(f'attempt {attempt}/18 failed: {exc}')
                  if attempt == 18:
                      raise
                  time.sleep(5)
          PY
          python scripts/verify_drawdown_production.py \
            --base-url "$BASE_URL" \
            --attempts 18 \
            --sleep-seconds 5
          python scripts/verify_drawdown_browser.py --base-url "$BASE_URL"

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawdown-production-browser-failures-${{ github.run_id }}
          path: /tmp/drawdown-*-failure.png
          if-no-files-found: ignore

  report:
    if: always() && github.event_name == 'workflow_run' && needs.identity.result == 'success'
    needs: [identity, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Publish production browser smoke status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
          SOURCE_SHA: ${{ needs.identity.outputs.source_commit }}
        run: |
          state=failure
          description="Production Drawdown browser smoke failed"
          if [ "$RESULT" = "success" ]; then
            state=success
            description="Production Drawdown browser smoke passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state="$state" \
            -f context="production/browser-smoke" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
